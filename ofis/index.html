<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Slayd Ol ofisi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="../go/config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;800&family=Red+Hat+Text:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: jonli boshqaruv xonasi — bir qarashda kim ishlayapti, kim dam olyapti, kim sizni kutyapti
   IDEA: kechki ofis maketi — derazalar, yonib turgan monitorlar, dam olish burchagi
   PICTURE: butun ekranni egallagan 3D ofis; har xodim ustida «hozir nima qilyapti» yorlig'i
   COLOUR and TYPE: to'q binafsha kecha, iliq yog'och pol, magenta — sizning qaroringiz kerak; Red Hat
   LAYOUT: sahna to'liq ekran; raqamlar va voqealar o'ngda yig'iladigan shisha panelda */
:root{--acc:#e0115f;--ok:#2fbf7f;--wait:#f0b429;--idle:#9aa3bd;--glass:rgba(16,14,34,.82);--line:rgba(255,255,255,.12);--mut:#aab3d6}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#140a1f;color:#fff;font:15px/1.45 "Red Hat Text",system-ui,sans-serif;overflow:hidden}
.app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:calc(8px + var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)) 14px 8px;background:#0b1f4b;z-index:5}
h1{font:800 20px/1.1 "Red Hat Display",sans-serif;margin:0;white-space:nowrap}
.live{background:var(--acc);border-radius:99px;padding:2px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.live.ok{background:#1f8a5b}
.sp{flex:1}.sm{display:none}
header button{font:600 14px "Red Hat Text";min-height:40px;min-width:40px;padding:0 12px;border-radius:10px;border:1px solid #33467d;background:#13295e;color:#fff;cursor:pointer}
header button[aria-pressed=true]{background:#fff;color:#0b1f4b}
header button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.stage{position:relative;flex:1;overflow:hidden;background:radial-gradient(ellipse at 45% 30%,#3b2050 0%,#1d1030 55%,#120a1c 100%);touch-action:none;cursor:grab}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.labs{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;will-change:transform}
.tag{position:absolute;transform:translate(-50%,-100%);background:rgba(12,10,28,.86);border:1px solid var(--line);border-radius:9px;padding:3px 9px 4px;white-space:nowrap;pointer-events:auto;cursor:pointer;line-height:1.25;max-width:230px}
.tag b{font-size:13px;display:flex;align-items:center;gap:6px}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--idle);flex:none}
.tag small{display:block;font-size:13px;color:#d7dcf3;overflow:hidden;text-overflow:ellipsis}
.lab.you .tag{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.lab.sel .tag{box-shadow:0 0 0 2px #fff}
.lab.far small{display:none}
.bb{position:absolute;transform:translate(-50%,calc(-100% - 50px));width:max-content;max-width:230px;background:#fff;color:#14163a;border-radius:12px;padding:6px 10px;font-size:13px;line-height:1.3;box-shadow:0 8px 20px rgba(0,0,0,.4);opacity:0;transition:opacity .35s,transform .35s}
.bb::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fff}
.bb.on{opacity:1;transform:translate(-50%,calc(-100% - 56px))}
.lab.you .bb{box-shadow:0 0 0 2px var(--acc),0 8px 20px rgba(0,0,0,.4)}
.tick{position:absolute;left:14px;right:14px;bottom:12px;display:flex;gap:18px;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:7px 14px;font-size:13px;white-space:nowrap;overflow:hidden;pointer-events:none}
.tick em{font-style:normal;font-weight:800;color:#ff6b9e;letter-spacing:.06em}
.tick span{overflow:hidden;text-overflow:ellipsis;color:#e3e7f8}
.tick i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px}
.panel{position:absolute;top:12px;right:12px;bottom:62px;width:318px;display:flex;flex-direction:column;gap:10px;transition:transform .35s;z-index:3}
.panel.hide{transform:translateX(calc(100% + 24px))}
.card{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:13px 15px;backdrop-filter:blur(8px)}
.card h2{font:700 15px "Red Hat Display";margin:0 0 8px;color:#fff}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 12px}
.st b{display:block;font:800 22px/1.1 "Red Hat Display";white-space:nowrap}
.st small{color:var(--mut);font-size:13px}.st.hot b{color:#ff4f8b}
.feedc{flex:1;display:flex;flex-direction:column;min-height:0}
.feed{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
.feed li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 9px;padding:6px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.35}
.feed li:first-child{border-top:0}.feed time{color:var(--mut);white-space:nowrap}
.feed .who{font-weight:700}.feed li.you .who{color:#ff4f8b}.feed li.empty{display:block;color:var(--mut)}
#det p{margin:2px 0 6px;font-size:14px}#det .k{color:var(--mut);font-size:13px;margin:0}
#det .x{float:right;background:none;border:0;color:#fff;font-size:20px;cursor:pointer;min-width:36px;min-height:32px}
.msg{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--glass);border:1px solid var(--acc);border-radius:12px;padding:8px 14px;font-size:14px;z-index:4;max-width:calc(100% - 28px);text-align:center}
.legend{position:absolute;left:14px;top:12px;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:#cfd5ee;background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:5px 10px;pointer-events:none}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
@media(max-width:760px){
  .panel{top:auto;left:8px;right:8px;width:auto;bottom:56px;max-height:58%}
  .panel.hide{transform:translateY(calc(100% + 70px))}
  .legend{display:none}.tick span:nth-child(n+3){display:none}
  h1{font-size:17px}.lg{display:none}.sm{display:inline}header{flex-wrap:nowrap;gap:6px;padding-left:10px;padding-right:10px}header button{padding:0 9px}
}
@media(prefers-reduced-motion:reduce){.bb,.panel{transition:none}}
</style>
</head>
<body>
<div class="app">
<header>
  <h1><span class="lg">Slayd Ol </span>Ofis</h1>
  <span class="live" id="live">Ulanmoqda…</span>
  <span class="sp"></span>
  <button id="zin" aria-label="Yaqinlashtirish">+</button>
  <button id="zout" aria-label="Uzoqlashtirish">−</button>
  <button id="view" aria-label="Ko'rinishni almashtirish"><span class="lg">Burish</span><span class="sm">⟳</span></button>
  <button id="pan" aria-pressed="true" aria-label="Panel"><span class="lg">Panel</span><span class="sm">☰</span></button>
  <button id="full" aria-label="To'liq ekran"><span class="lg">To'liq ekran</span><span class="sm">⛶</span></button>
</header>
<div class="stage" id="stage">
  <div class="labs" id="labs"></div>
  <div class="legend"><span><i style="background:var(--ok)"></i>ishlayapti</span><span><i style="background:var(--wait)"></i>e'tibor</span><span><i style="background:var(--idle)"></i>dam olyapti</span><span><i style="background:var(--acc)"></i>sizni kutyapti</span></div>
  <div class="msg" id="msg" hidden></div>
  <aside class="panel" id="panel">
    <div class="card" id="det" hidden></div>
    <div class="card"><h2>Bugun (Toshkent 00:00 dan)</h2>
      <div class="stats">
        <div class="st"><b id="sRev">—</b><small>tushum, so'm</small></div>
        <div class="st"><b id="sCost">—</b><small>AI xarajati, so'm</small></div>
        <div class="st"><b id="sMar">—</b><small>sof foyda</small></div>
        <div class="st"><b id="sDone">—</b><small>yetkazildi</small></div>
        <div class="st"><b id="sQ">—</b><small>navbatda</small></div>
        <div class="st hot"><b id="sYou">—</b><small>sizni kutmoqda</small></div>
        <div class="st"><b id="sVote">—</b><small>yoqdi / yoqmadi</small></div>
        <div class="st"><b id="sUsers">—</b><small>yangi foydalanuvchi</small></div>
      </div>
    </div>
    <div class="card feedc"><h2>Voqealar (oxirgi 6 soat)</h2><ul class="feed" id="feed"></ul></div>
  </aside>
  <div class="tick" id="tick"><em>LIVE</em></div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
{
const $=id=>document.getElementById(id),stage=$("stage"),labs=$("labs");
const fmt=n=>Math.round(+n||0).toLocaleString("ru-RU").replace(/[\s,  ]/g," ");
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ================= SAHNA ================= */
const R=new THREE.WebGLRenderer({antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=.92;
stage.prepend(R.domElement);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(30,1,1,400);
scene.add(new THREE.HemisphereLight(0xfff3e6,0x5b4a70,.5));
const sun=new THREE.DirectionalLight(0xffe2c4,1.05);sun.position.set(-18,34,22);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-30,right:30,top:24,bottom:-24,near:1,far:110});sun.shadow.bias=-.0006;scene.add(sun);
const fill=new THREE.DirectionalLight(0x9fb6ff,.35);fill.position.set(20,12,-10);scene.add(fill);
const MC={};
const M=(c,o={})=>{const k=c+JSON.stringify(o);return MC[k]||(MC[k]=new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.82,metalness:0},o)))};
function add(m,par){m.castShadow=m.receiveShadow=true;(par||scene).add(m);return m}
function box(w,h,d,c,x,y,z,par,o){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),typeof c==="object"?c:M(c,o));m.position.set(x,y+h/2,z);return add(m,par)}
function cyl(rt,rb,h,c,x,y,z,par,seg=18,o){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),typeof c==="object"?c:M(c,o));m.position.set(x,y+h/2,z);return add(m,par)}
function canvasTex(w,h){const cv=document.createElement("canvas");cv.width=w;cv.height=h;const t=new THREE.CanvasTexture(cv);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return {cv,ctx:cv.getContext("2d"),t}}

// --- bino: pol, devorlar, derazalar
const FW=44,FD=30;
box(FW+1.2,1,FD+1.2,0xb9786c,0,-1,0);
const floorT=canvasTex(1024,700);{const g=floorT.ctx;g.fillStyle="#9c6a3e";g.fillRect(0,0,1024,700);
  for(let y=0;y<700;y+=35){for(let x=-(y/35%2)*80;x<1024;x+=160){const l=178+Math.random()*30|0;g.fillStyle=`rgb(${l},${l-55},${l-100})`;g.fillRect(x+1,y+1,158,33)}}}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(FW,FD),new THREE.MeshStandardMaterial({map:floorT.t,roughness:.75}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const WH=4.2,wallC=0xe9d6c8;
box(FW,WH,.5,wallC,0,0,-FD/2-.25);box(.5,WH,FD,wallC,-FW/2-.25,0,0);
box(FW,.35,.7,0xd9a598,0,WH,-FD/2-.25);box(.7,.35,FD,0xd9a598,-FW/2-.25,WH,0);
box(FW,.3,.56,0xc9998c,0,0,-FD/2+.04);box(.56,.3,FD,0xc9998c,-FW/2+.04,0,0);
const glassM=new THREE.MeshStandardMaterial({color:0x9fd0ff,emissive:0x4f8fd8,emissiveIntensity:.55,roughness:.15,transparent:true,opacity:.85});
for(const x of[-2,4.5,11,17.5]){box(4.6,2.4,.12,0x3a3048,x,1.1,-FD/2+.02);box(4.2,2.0,.1,glassM,x,1.3,-FD/2+.1);box(.12,2.0,.12,0x3a3048,x,1.3,-FD/2+.12)}
for(const z of[-1,6.5]){box(.12,2.4,4.6,0x3a3048,-FW/2+.02,1.1,z);box(.1,2.0,4.2,glassM,-FW/2+.1,1.3,z);box(.12,2.0,.12,0x3a3048,-FW/2+.12,1.3,z)}
// logotip devorda
const logoT=canvasTex(512,128);{const g=logoT.ctx;g.fillStyle="#0b1f4b";g.fillRect(0,0,512,128);g.fillStyle="#fff";g.font="800 64px Red Hat Display, sans-serif";g.textAlign="center";g.textBaseline="middle";g.fillText("SLAYD OL",256,58);g.fillStyle="#e0115f";g.fillRect(156,98,200,8)}
box(5.4,1.35,.1,new THREE.MeshStandardMaterial({map:logoT.t,roughness:.6}),-7.5,2.25,-FD/2+.08);
// devor soati
const clockT=canvasTex(256,256);const clockM=new THREE.MeshStandardMaterial({map:clockT.t,roughness:.6});
const clock=new THREE.Mesh(new THREE.CylinderGeometry(.75,.75,.1,32),[M(0x2b2540),clockM,M(0x2b2540)]);clock.rotation.x=Math.PI/2;clock.position.set(7.8,3.25,-FD/2+.12);scene.add(clock);
// zonalarga gilam
function rug(x,z,w,d,c){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),M(c,{roughness:1}));m.rotation.x=-Math.PI/2;m.position.set(x,.012,z);m.receiveShadow=true;scene.add(m)}
rug(-16.5,-11,10.5,7.8,0xb9a6d6);rug(0,-.6,18,9.6,0x8d9bc4);rug(-15.5,11.8,12.5,6,0xe7b17a);rug(15,11.4,13,6,0xa9cfc3);rug(17,-11,9.5,7.8,0xe8a3b9);rug(-7,-12.8,8.5,4,0x39406b);

// --- shisha devor: menejer kabineti
const gl2=new THREE.MeshStandardMaterial({color:0xcfe8ff,roughness:.05,transparent:true,opacity:.25});
box(3.8,2.6,.08,gl2,-20.1,0,-7);box(3.8,2.6,.08,gl2,-13.9,0,-7);box(.08,2.6,8,gl2,-12,0,-11);
for(const x of[-22,-18.2,-15.8,-12])box(.12,2.6,.12,0x6e6a82,x,0,-7);

/* --- ish stoli + monitor (ekran — canvas) */
const screens=[];
function workstation(x,z,opt={}){
  const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
  const top=opt.dark?0x4b5594:0xf4f1ec,leg=0x8b8fa3;
  box(2.6,.1,1.25,top,0,.92,0,g);for(const sx of[-1.2,1.2])for(const sz of[-.52,.52])box(.08,.92,.08,leg,sx,0,sz,g);
  box(.5,.62,1.05,0xd8d2c8,.95,.25,0,g);
  const sc=canvasTex(256,160);const scrM=new THREE.MeshStandardMaterial({map:sc.t,emissive:0xffffff,emissiveMap:sc.t,emissiveIntensity:.9,roughness:.4});
  const mon=new THREE.Group();mon.position.set(0,1.02,-.35);g.add(mon);
  box(.12,.3,.12,0x2a2a35,0,0,0,mon);box(.45,.04,.3,0x2a2a35,0,0,0,mon);
  const frame=box(1.42,.9,.07,0x1b1b26,0,.3,0,mon);const scr=new THREE.Mesh(new THREE.PlaneGeometry(1.32,.8),scrM);scr.position.set(0,.75,.04);mon.add(scr);
  if(opt.two){const m2=mon.clone();m2.position.set(-.95,1.02,-.25);m2.rotation.y=.35;g.add(m2);m2.traverse(o=>{if(o.isMesh&&o.material===scrM)o.material=scrM})}
  box(.9,.03,.3,0x30303c,0,.97,.1,g);box(.14,.03,.2,0x30303c,.65,.97,.15,g);
  cyl(.11,.11,.16,0xffffff,-1,.97,.25,g,10);if(opt.plant){cyl(.14,.11,.22,0xd08a6a,1.05,.97,-.3,g,10);const p=new THREE.Mesh(new THREE.SphereGeometry(.2,8,6),M(0x4caf7d));p.position.set(1.05,1.36,-.3);add(p,g)}
  // stul
  const ch=new THREE.Group();ch.position.set(0,0,1.05);g.add(ch);
  cyl(.06,.06,.42,0x333344,0,0,0,ch,8);box(.72,.1,.68,opt.chair||0x5a4fcf,0,.45,0,ch);box(.72,.75,.1,opt.chair||0x5a4fcf,0,.55,.33,ch);
  const s={g,sc,scrM,mode:"off",t:0,label:opt.label||""};screens.push(s);drawScreen(s,0);
  return {x,z,seat:[x,z+1.05],screen:s,g};
}
function drawScreen(s,t){const g=s.sc.ctx,W=256,H=160;
  if(s.mode==="work"){g.fillStyle="#f5f6fb";g.fillRect(0,0,W,H);g.fillStyle="#0b1f4b";g.fillRect(0,0,W,16);g.fillStyle="#e0115f";g.fillRect(6,5,6,6);
    g.fillStyle="#dfe4f2";g.fillRect(8,24,70,128);for(let i=0;i<5;i++){g.fillStyle=i===(t|0)%5?"#3b6fd8":"#c3cbe2";g.fillRect(14,30+i*24,58,18)}
    g.fillStyle="#fff";g.fillRect(88,24,160,104);g.fillStyle="#0b1f4b";g.fillRect(98,34,90,10);
    const n=(t*3|0)%7;for(let i=0;i<=n;i++){g.fillStyle="#9aa6c6";g.fillRect(98,54+i*10,40+((i*37)%90),5)}
    g.fillStyle="#3b6fd8";g.fillRect(196,52,42,40);g.fillStyle="#e3e7f2";g.fillRect(88,136,160,10);g.fillStyle="#2fbf7f";g.fillRect(88,136,160*((t*.07)%1),10)}
  else if(s.mode==="alert"){g.fillStyle=(t*2|0)%2?"#5a0d2a":"#e0115f";g.fillRect(0,0,W,H);g.fillStyle="#fff";g.font="700 26px sans-serif";g.textAlign="center";g.fillText("DIQQAT",W/2,H/2+8)}
  else if(s.mode==="sleep"){g.fillStyle="#0c1030";g.fillRect(0,0,W,H);g.fillStyle="#6c7bd8";g.font="700 22px sans-serif";g.textAlign="center";g.fillText("Slayd Ol",W/2+Math.sin(t)*50,H/2+Math.cos(t*.7)*30)}
  else{g.fillStyle="#0a0a12";g.fillRect(0,0,W,H)}
  s.sc.t.needsUpdate=true}

// --- joylar
const D={
 w1:workstation(-6,-4.2,{plant:1}),w2:workstation(0,-4.2,{two:1}),w3:workstation(6,-4.2,{plant:1}),w4:workstation(-3,1.3,{two:1}),w5:workstation(3,1.3,{plant:1}),
 m:workstation(-17,-11.6,{two:1,chair:0x2c2c3e,plant:1}),k:workstation(17,-11.2,{chair:0xc0336a}),n:workstation(-9,-12.6,{dark:1,two:1,chair:0x2c2c3e}),
 y:workstation(-19.5,-2.2,{chair:0xe07a1f}),q:workstation(-15.5,3,{chair:0x0f9aa8,plant:1}),s:workstation(19.5,-2.2,{chair:0x7a3fc4}),x:workstation(14.5,3,{two:1,chair:0xc23a7c})};
// server javonlari (miltillovchi chiroqlar)
const leds=[];for(let i=0;i<4;i++){const x=-5.5+i*1.25;box(1.05,2.7,1,0x161a33,x,0,-14.2);
  for(let j=0;j<6;j++){const m=new THREE.MeshStandardMaterial({color:0x66b3ff,emissive:0x3a8cff,emissiveIntensity:1});const l=box(.7,.05,.02,m,x,.45+j*.38,-13.69);leds.push(m)}}
// kassa: seyf va kassa apparati
box(1.4,1.7,1.2,0x3b3f52,20.6,0,-14);cyl(.16,.16,.08,0xf0b429,20.6,1.05,-13.36,null,16).rotation.x=Math.PI/2;
box(.6,.35,.5,0x2b2b3a,18.05,.97,-11.0);box(.45,.22,.05,0x7fe0a8,18.05,1.25,-11.2,null,{emissive:0x2fbf7f,emissiveIntensity:.8});
// menejer doskasi (bugungi raqamlar)
const boardT=canvasTex(512,300);const board=box(4.2,2.4,.08,new THREE.MeshStandardMaterial({map:boardT.t,roughness:.5}),-17,1.2,-14.85);
box(4.4,.1,.25,0x8a8fa3,-17,1.15,-14.7);
function drawBoard(d){const g=boardT.ctx;g.fillStyle="#fbfbf7";g.fillRect(0,0,512,300);g.strokeStyle="#c9ccd8";g.lineWidth=6;g.strokeRect(3,3,506,294);

let last=performance.now(),tScreen=0,tLed=0;
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;const T=t/1000;
  for(const c of C){
    if(c.path.length){const [tx,tz]=c.path[0],dx=tx-c.x,dz=tz-c.z,d=Math.hypot(dx,dz);
      if(d<.06){c.path.shift();if(!c.path.length){c.pose="stand";if(c.face!==undefined)c.ry=c.face;const r=c.arrive;c.arrive=null;r&&r()}}
      else{const st=Math.min(d,c.speed*dt);c.x+=dx/d*st;c.z+=dz/d*st;c.ry=Math.atan2(dx,dz)}}
    let dr=c.ry-c.root.rotation.y;dr=Math.atan2(Math.sin(dr),Math.cos(dr));c.root.rotation.y+=dr*Math.min(1,dt*10);
    c.root.position.set(c.x,0,c.z);
    const B=c.body,sw=still?0:Math.sin(T*9);let y=0;
    c.lL.rotation.x=c.lR.rotation.x=0;c.aL.rotation.set(0,0,0);c.aR.rotation.set(0,0,0);c.head.rotation.set(0,0,0);B.rotation.x=0;
    if(c.pose==="walk"){c.lL.rotation.x=sw*.6;c.lR.rotation.x=-sw*.6;c.aL.rotation.x=-sw*.5;c.aR.rotation.x=sw*.5;y=Math.abs(sw)*.06}
    else if(c.pose==="sit"){c.lL.rotation.x=c.lR.rotation.x=-Math.PI/2;y=-.36+(c.seatY||0);
      if(c.anim==="type"){c.aL.rotation.x=-1.25+(still?0:Math.sin(T*18)*.12);c.aR.rotation.x=-1.25+(still?0:Math.cos(T*17)*.12);c.head.rotation.x=.08}
      else if(c.anim==="sleep"){B.rotation.x=.45;c.head.rotation.x=.5;c.aL.rotation.x=c.aR.rotation.x=-1.5}
      else if(c.anim==="phone"){c.aR.rotation.x=-1.6;c.aL.rotation.x=-1.4;c.head.rotation.x=.35}
      else{c.aL.rotation.x=c.aR.rotation.x=-.3}}
    else{ // turish
      if(c.anim==="coffee"){c.aR.rotation.x=-1.1-(still?0:Math.max(0,Math.sin(T*1.3))*1.1);c.head.rotation.x=-.05}
      else if(c.anim==="stretch"){const s=still?0:Math.sin(T*2);c.aL.rotation.z=-2.7+s*.2;c.aR.rotation.z=2.7-s*.2;y=Math.max(0,s)*.05}
      else if(c.anim==="ping"){c.aR.rotation.x=-1.0+(still?0:Math.sin(T*6+(c.x>0?Math.PI:0))*.7);c.aR.rotation.z=.3;y=still?0:Math.abs(Math.sin(T*3))*.04}
      else if(c.anim==="water"){c.aR.rotation.x=-1.0;c.aR.rotation.z=.2;c.head.rotation.x=.3}
      else if(c.anim==="talk"){c.aR.rotation.x=-.6+(still?0:Math.sin(T*4)*.4);c.aL.rotation.x=-.2}
      else if(!still){c.head.rotation.y=Math.sin(T*.6+c.x)*.25;y=Math.sin(T*2+c.z)*.01}}
    B.position.y=y;
    const asleep=c.pose==="sit"&&c.anim==="sleep";
    c.zs.forEach((s,k)=>{s.visible=asleep;if(asleep){const p=((T*.5+k/3)%1);s.position.set(c.x+.3+p*.5,2.3+p*1.4,c.z-.2);s.material.opacity=1-p;s.scale.setScalar(.25+p*.25)}});
    if(c.root.visible){const p=proj(c.x,c.pose==="sit"?3.05:3.55,c.z,c.lab);if(p)LP.push(p)}
  }
  // to'p (stol tennisi)
  if(S.game&&!still){const p=((t-S.game)/700)%2,u=p<1?p:2-p;ball.visible=true;ball.position.set(-12.3+u*3.6,.95+Math.sin(u*Math.PI)*.8,11.5+Math.sin(T*1.7)*.4)}else ball.visible=false;
  if(t-tScreen>350){tScreen=t;for(const s of screens)if(s.mode!=="off"||s.drawn!=="off"){drawScreen(s,T);s.drawn=s.mode}drawTv(T)}
  if(t-tLed>200){tLed=t;for(const m of leds)m.emissiveIntensity=Math.random()<.25?.15:1.1}
  declutter();
  R.render(scene,cam);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
function drawClock(){const g=clockT.ctx,now=new Date(Date.now()+(new Date().getTimezoneOffset()+300)*6e4),h=now.getHours()%12,m=now.getMinutes();
  g.fillStyle="#fff";g.fillRect(0,0,256,256);g.strokeStyle="#0b1f4b";g.lineWidth=14;g.beginPath();g.arc(128,128,112,0,7);g.stroke();
  for(let i=0;i<12;i++){const a=i/12*Math.PI*2;g.fillStyle="#0b1f4b";g.fillRect(128+Math.sin(a)*90-4,128-Math.cos(a)*90-4,8,8)}
  const hand=(a,l,w,c)=>{g.strokeStyle=c;g.lineWidth=w;g.lineCap="round";g.beginPath();g.moveTo(128,128);g.lineTo(128+Math.sin(a)*l,128-Math.cos(a)*l);g.stroke()};
  hand((h+m/60)/12*Math.PI*2,55,12,"#0b1f4b");hand(m/60*Math.PI*2,85,8,"#e0115f");clockT.t.needsUpdate=true}
drawClock();setInterval(drawClock,30000);

// --- boshqaruv: surish — aylantirish, g'ildirak/qisish — yaqinlashtirish, bosish — xodimni tanlash
const ptrs=new Map();let drag=null,pinch=0;
stage.addEventListener("pointerdown",e=>{if(e.target.closest(".panel,.tag,.msg"))return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);stage.setPointerCapture(e.pointerId);
  drag={x:e.clientX,y:e.clientY,az:S.az,el:S.el,moved:false};if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch=Math.hypot(a[0]-b[0],a[1]-b[1])}});
stage.addEventListener("pointermove",e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===2){const [a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch){S.zoom=Math.min(3,Math.max(.7,S.zoom*d/pinch));setCam()}pinch=d;drag.moved=true;return}
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)drag.moved=true;
  S.az=drag.az-dx*.005;S.el=Math.min(1.35,Math.max(.45,drag.el+dy*.004));setCam()});
stage.addEventListener("pointerup",e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=0;
  if(drag&&!drag.moved&&!e.target.closest(".panel,.tag")){const r=stage.getBoundingClientRect(),rc=new THREE.Raycaster();
    rc.setFromCamera({x:(e.clientX-r.left)/r.width*2-1,y:-(e.clientY-r.top)/r.height*2+1},cam);const h=rc.intersectObjects(pickable)[0];if(h)select(h.object.userData.c)}
  if(!ptrs.size)drag=null});
stage.addEventListener("wheel",e=>{e.preventDefault();S.zoom=Math.min(3,Math.max(.7,S.zoom*(e.deltaY<0?1.1:.9)));setCam()},{passive:false});
$("zin").onclick=()=>{S.zoom=Math.min(3,S.zoom*1.2);setCam()};$("zout").onclick=()=>{S.zoom=Math.max(.7,S.zoom/1.2);setCam()};
const VIEWS=[[.55,.86],[-.5,.8],[0,1.2],[1.1,.7]];let vi=0;$("view").onclick=()=>{vi=(vi+1)%VIEWS.length;[S.az,S.el]=VIEWS[vi];setCam()};
$("pan").onclick=e=>{const p=$("panel").classList.toggle("hide");e.currentTarget.setAttribute("aria-pressed",!p);setCam()};
if(innerWidth<760){$("panel").classList.add("hide");$("pan").setAttribute("aria-pressed","false");if(innerWidth<innerHeight){S.az=.95;S.el=1.0}setCam()}
const tg=window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData!==undefined?Telegram.WebApp:null;
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor&&tg.setHeaderColor("#0b1f4b");tg.disableVerticalSwipes&&tg.disableVerticalSwipes()}catch(e){}}
$("full").onclick=()=>{try{if(tg&&tg.requestFullscreen){tg.isFullscreen?tg.exitFullscreen():tg.requestFullscreen()}
  else if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};

function select(c){S.sel=c;C.forEach(o=>o.lab.classList.toggle("sel",o===c));$("panel").classList.remove("hide");$("pan").setAttribute("aria-pressed","true");setCam();showDet()}
function showDet(){const c=S.sel,d=$("det");if(!c){d.hidden=true;return}d.hidden=false;
  d.innerHTML=`<button class="x" aria-label="Yopish">×</button><h2></h2><p class="k">Hozir</p><p class="t"></p><p class="k">Vazifasi</p><p class="r"></p><p class="k">Ma'lumot manbasi</p><p class="s"></p>`;
  d.querySelector("h2").textContent=c.nm;d.querySelector(".t").textContent=c.status||"—";d.querySelector(".r").textContent=c.role;d.querySelector(".s").textContent=c.src;
  d.querySelector(".x").onclick=()=>{S.sel=null;C.forEach(o=>o.lab.classList.remove("sel"));showDet()}}

/* ================= MA'LUMOT ================= */
const NAMES={queue:"Navbat",worker:"Ishchi",cashier:"Kassir",quality:"Sifatchi",support:"Yordamchi",guard:"Navbatchi",manager:"Menejer"};
const L={tz:18000,first:true,lastT:0,slotOf:{},fails:0};
const hmT=t=>new Date((t+L.tz)*1000).toISOString().slice(11,16);
const ICON=s=>/rasm/.test(s)?"🖼️":/reja/.test(s)?"🗂️":/manba/.test(s)?"🔎":/tekshir|sifat/.test(s)?"🧐":/tuzat/.test(s)?"🛠️":/yig'il|PDF|fayl/.test(s)?"📦":"✍️";
function apply(d){S.data=d;L.tz=d.tz||18000;const slots=Math.min(workers.length,Math.max(1,d.slots||5));
  workers.forEach((c,i)=>{const on=i<slots;c.root.visible=on;c.lab.style.display=on?"":"none"});
  const ids=new Set(d.workers.map(o=>o.id));
  for(const id of Object.keys(L.slotOf))if(!ids.has(+id)){const c=workers[L.slotOf[id]];if(c&&!L.first)c.jobs.push({t:"deliver",id});delete L.slotOf[id]}
  for(const o of d.workers)if(L.slotOf[o.id]===undefined){const used=new Set(Object.values(L.slotOf));const f=[...Array(slots).keys()].find(i=>!used.has(i));
    if(f===undefined)continue;L.slotOf[o.id]=f;if(!L.first)workers[f].jobs.push({t:"fetch",id:o.id})}
  const bySlot={};for(const o of d.workers)if(L.slotOf[o.id]!==undefined)bySlot[L.slotOf[o.id]]=o;
  workers.forEach((c,i)=>{const o=bySlot[i];c.duty=o?{text:`${ICON(o.stage)} #${o.id} ${o.title}: ${o.stage} · ${Math.max(0,Math.round((d.now-o.since)/60))} daq`}:null});
  folders.forEach((f,i)=>f.visible=i<Math.min(12,d.queue.n));drawQueue(d.queue.n);
  const fresh=L.first?[]:d.events.filter(e=>e.t>L.lastT).reverse();
  for(const e of fresh){
    if(e.who==="cashier"&&e.state!=="you")by("k").jobs.push({t:"safe",text:"💰 "+e.text});
    if(e.who==="quality")by("q").jobs.push({t:"visit",text:(e.state==="wait"?"😟 ":"😊 ")+e.text,bad:e.state==="wait"});
    if(e.who==="guard"){const n=by("n");say(n,"⚠️ "+e.text,9000);n.busyUntil=Date.now()+60000;n.duty={text:"⚠️ "+e.text,state:"wait",alert:true};n.alertUntil=Date.now()+60000}
  }
  L.lastT=Math.max(L.lastT,...d.events.map(e=>e.t),0);
  const k=by("k");k.duty=d.pending.checks?{text:`🧾 ${d.pending.checks} ta karta cheki tasdig'ingizni kutmoqda`,state:"you"}:null;
  const y=by("y");y.duty=d.pending.support?{text:`🎧 ${d.pending.support} ta mijoz javobingizni kutmoqda (/chat)`,state:"you"}:null;
  const n=by("n"),hb=d.heartbeat;
  if(hb!==null&&hb>600)n.duty={text:`🚨 Ishchilar ${Math.round(hb/60)} daqiqadan beri jim — serverni tekshiring`,state:"you",alert:true};
  else if(!(n.alertUntil>Date.now()))n.duty=null;
  const t=d.today,mar=t.revenue?Math.round((t.revenue-t.cost)/t.revenue*100):0,you=d.pending.checks+d.pending.support;
  const m=by("m");m.summary=`📊 Bugun ${t.done} ta ish yetkazildi${t.failed?`, ${t.failed} ta xato`:""}, foyda ${mar}%. `+(you?`${you} ta masala sizni kutmoqda`:"Hammasi joyida 👌");
  $("sRev").textContent=fmt(t.revenue);$("sCost").textContent=fmt(t.cost);$("sMar").textContent=t.revenue?mar+"%":"—";$("sDone").textContent=t.done;
  $("sQ").textContent=d.queue.n;$("sYou").textContent=you;$("sVote").textContent=`${t.likes} / ${t.dislikes}`;$("sUsers").textContent=t.users;
  drawBoard(d);feed(d.events);L.first=false}
function feed(evs){const f=$("feed");f.textContent="";
  if(!evs.length){const li=document.createElement("li");li.className="empty";li.textContent="Oxirgi 6 soatda voqea yo'q.";f.appendChild(li)}
  for(const e of evs){const li=document.createElement("li");if(e.state==="you")li.className="you";
    li.innerHTML=`<time></time><span><span class="who"></span> · <span class="t"></span></span>`;
    li.querySelector("time").textContent=hmT(e.t);li.querySelector(".who").textContent=NAMES[e.who]||e.who;li.querySelector(".t").textContent=e.text;f.appendChild(li)}
  const tk=$("tick");tk.innerHTML="<em>LIVE</em>";
  for(const e of evs.slice(0,3)){const sp=document.createElement("span");sp.innerHTML="<i></i>";const s=hmT(e.t)+" "+(NAMES[e.who]||e.who)+" · "+e.text;sp.append(s.length>60?s.slice(0,58)+"…":s);tk.appendChild(sp)}}

setInterval(()=>{const m=by("m");if(m.summary)say(m,m.summary,9000)},50000);

/* --- ulanish (Telegram) yoki namuna (brauzerda) */
const INIT=tg?tg.initData:"";const DEMO=!INIT;
const API=((window.GO_CONFIG&&GO_CONFIG.apiBase)||"")+"/api/t/view";
function liveSt(txt,ok){const s=$("live");s.textContent=txt;s.classList.toggle("ok",!!ok)}
async function poll(){
  try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({of:1,init:INIT})});
    if(r.status===401||r.status===403){liveSt("Ruxsat yo'q");$("msg").hidden=false;$("msg").textContent=r.status===403?"Bu ofis faqat bot adminlari uchun.":"Telegram imzosi eskirgan — botda /ofis orqali qayta oching.";return}
    if(!r.ok)throw new Error(r.status);apply(await r.json());L.fails=0;$("msg").hidden=true;liveSt("● Jonli · "+hmT(Math.floor(Date.now()/1000)),true)}
  catch(e){L.fails++;liveSt(L.fails>2?"Aloqa yo'q":"Qayta urinilmoqda…")}
  setTimeout(poll,document.hidden?15000:5000)}
/* namuna: Telegram tashqarisida ochilsa — o'ylab topilgan ma'lumot (haqiqiy emas) */
const SIM={oid:3300,run:[],q:[],ev:[],today:{revenue:186400,cost:81200,done:23,failed:0,likes:9,dislikes:2,users:41},checks:1,support:0};
const KD=[["Standart taqdimot",8900],["Premium taqdimot",14900],["Referat",10000],["Imtihon javoblari",5000],["HEMIS topshirig'i",7000]];
const STG=["reja tuzilmoqda","manbalar qidirilmoqda","matn yozilmoqda","sifat tekshirilmoqda","rasmlar tanlanmoqda","fayl yig'ilmoqda"];
function simTick(){const now=Math.floor(Date.now()/1000),E=(who,text,state)=>SIM.ev.unshift({t:now,who,text,state});
  if(Math.random()<.35){const k=pick(KD),o={id:++SIM.oid,title:k[0],price:k[1]};SIM.q.push(o);E("queue",`Yangi buyurtma #${o.id} · ${o.title} · ${fmt(o.price)} so'm`)}
  for(const o of SIM.run){o.st++;o.stage=STG[Math.min(STG.length-1,o.st>>1)]}
  const done=SIM.run.filter(o=>o.st>13);for(const o of done){SIM.run.splice(SIM.run.indexOf(o),1);SIM.today.done++;SIM.today.cost+=o.price*.45;E("worker",`#${o.id} ${o.title} mijozga yetkazildi`);
    if(Math.random()<.5){const bad=Math.random()<.2;bad?SIM.today.dislikes++:SIM.today.likes++;E("quality",`#${o.id}: mijoz «${bad?"yoqmadi":"yoqdi"}» bosdi`,bad?"wait":"work")}}
  while(SIM.run.length<3&&SIM.q.length){const o=SIM.q.shift();o.st=0;o.stage=STG[0];o.since=now;SIM.run.push(o)}
  if(Math.random()<.18){const a=pick([8900,10000,15000,20000]);SIM.today.revenue+=a;E("cashier",`${pick(["Click","Payme"])} · ${fmt(a)} so'm qabul qilindi`)}
  if(Math.random()<.06)SIM.support=SIM.support?0:1;SIM.ev=SIM.ev.slice(0,30);
  apply({now,tz:18000,slots:5,workers:SIM.run.map(o=>({id:o.id,title:o.title,stage:o.stage,since:o.since})),queue:{n:SIM.q.length,items:[]},
    today:SIM.today,pending:{checks:SIM.checks,support:SIM.support},heartbeat:12,events:SIM.ev})}
for(const c of C)life(c);
if(DEMO){liveSt("Namuna rejim");$("msg").hidden=false;$("msg").textContent="Namuna: ma'lumot o'ylab topilgan. Haqiqiy ofis — botda /ofis (Telegram ichida).";setTimeout(()=>$("msg").hidden=true,9000);
  SIM.q.push({id:++SIM.oid,title:"Premium taqdimot",price:14900},{id:++SIM.oid,title:"Referat",price:10000});simTick();setInterval(simTick,4000)}
else poll();
}
