<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dizaynlar — Slayd Ol</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f4f8);
    --fg: var(--tg-theme-text-color, #111827);
    --muted: var(--tg-theme-hint-color, #6b7280);
    --btn: var(--tg-theme-button-color, #2563eb);
    --btn-fg: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-section-bg-color, #ffffff);
    --vip: #7c3aed; --pro: #b7862f; --ok: #16a34a;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.4 -apple-system, "Segoe UI", Roboto, Inter, system-ui, sans-serif; }
  body { padding: 0 0 120px; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 16px 4px;
    border-bottom: 1px solid rgba(127,127,127,.15); }
  h1 { font-size: 18px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12.5px; margin: 0 0 8px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 6px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; padding: 7px 12px; border-radius: 999px; background: var(--bg2); color: var(--fg);
    font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; border: 0; font-family: inherit; }
  .tab.active { background: var(--btn); color: var(--btn-fg); }
  .tiers .tab { font-size: 12px; padding: 5px 10px; }
  .tiers .tab.active { background: var(--fg); color: var(--bg); }
  h2 { font-size: 15px; margin: 18px 16px 2px; display: flex; align-items: center; gap: 8px; }
  h2 small { color: var(--muted); font-weight: 500; font-size: 12px; }
  .note { color: var(--muted); font-size: 12px; margin: 0 16px 6px; }
  .grid { padding: 8px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (min-width: 620px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 980px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  .rec { display: flex; gap: 10px; overflow-x: auto; padding: 8px 16px; scrollbar-width: none; scroll-snap-type: x mandatory; }
  .rec::-webkit-scrollbar { display: none; }
  .rec .card { flex: 0 0 72%; max-width: 300px; scroll-snap-align: start; }
  .card { position: relative; border-radius: var(--radius); overflow: hidden; background: var(--card); cursor: pointer;
    border: 2px solid transparent; transition: transform .12s, border-color .12s;
    box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.08); }
  .card:active { transform: scale(.98); }
  .card.sel { border-color: var(--btn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--btn) 30%, transparent); }
  .thumb { position: relative; }
  .thumb img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; background: var(--bg2); }
  .card.locked .thumb img { filter: saturate(.75) brightness(.92); }
  .badge { position: absolute; bottom: 6px; left: 6px; font-size: 10.5px; font-weight: 800; color: #fff;
    padding: 2px 7px; border-radius: 999px; letter-spacing: .2px; }
  .badge.vip { background: var(--vip); }
  .badge.pro { background: var(--pro); }
  .badge.open { background: var(--ok); }
  .lock { position: absolute; right: 6px; bottom: 6px; width: 26px; height: 26px; border-radius: 50%;
    background: rgba(0,0,0,.6); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .check { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%; background: var(--btn);
    color: var(--btn-fg); display: none; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; }
  .card.sel .check { display: flex; }
  .name { padding: 7px 9px 8px; font-size: 12.5px; font-weight: 650; display: flex; gap: 6px; align-items: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 11px; height: 11px; border-radius: 50%; flex: 0 0 auto;
    background: linear-gradient(135deg, var(--c1) 50%, var(--c2) 50%); box-shadow: 0 0 0 1px rgba(127,127,127,.3); }
  .empty { padding: 24px 16px; color: var(--muted); text-align: center; }
  /* tanlangan dizayn haqida */
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg);
    border-top: 1px solid rgba(127,127,127,.18); padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    box-shadow: 0 -8px 24px rgba(0,0,0,.08); }
  .sheet .row { display: flex; gap: 10px; align-items: flex-start; }
  .sheet .info { flex: 1; min-width: 0; }
  .sheet b { font-size: 14.5px; }
  .sheet .d { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .sheet .inner { width: 100%; border-radius: 10px; margin-top: 8px; display: block; background: var(--bg2); max-height: 120px; object-fit: cover; }
  .sheet .lockmsg { margin-top: 8px; font-size: 12.5px; padding: 7px 10px; border-radius: 10px;
    background: color-mix(in srgb, var(--pro) 14%, transparent); }
  .sheet .lockmsg.vip { background: color-mix(in srgb, var(--vip) 14%, transparent); }
  .btn { width: 100%; margin-top: 10px; padding: 13px; border: 0; border-radius: 12px; background: var(--btn);
    color: var(--btn-fg); font-size: 15.5px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .hint { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg); color: var(--muted);
    text-align: center; font-size: 13px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid rgba(127,127,127,.15); }
  .x { border: 0; background: var(--bg2); color: var(--fg); width: 30px; height: 30px; border-radius: 50%; font-size: 15px; cursor: pointer; flex: 0 0 auto; }
</style>
</head>
<body>
<header>
  <h1 id="h1"></h1>
  <p class="sub" id="sub"></p>
  <div class="tabs" id="tabs"></div>
  <div class="tabs tiers" id="tiers"></div>
</header>
<main id="main"></main>
<div class="hint" id="hint"></div>
<div class="sheet" id="sheet" hidden></div>
<script>
(async function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  const q = new URLSearchParams(location.search);
  const lang = q.get('lang') === 'ru' ? 'ru' : 'uz';
  const tier = ['pro', 'vip'].includes(q.get('tier')) ? q.get('tier') : 'std';   // foydalanuvchi tanlagan variant
  const rec = (q.get('rec') || '').split(',').filter(Boolean);
  const L = {
    uz: { title: '🎨 Barcha dizaynlar', all: 'Hammasi', anyTier: 'Barchasi', mine: '✨ Mavzuingizga mos',
          mineNote: 'Mavzu va auditoriyangizga qarab tanlandi',
          sub: n => `${n} ta dizayn. Namunadagi rasm — misol: taqdimotingizda o‘z mavzuingiz rasmi bo‘ladi.`,
          groups: { vip: '💎 VIP Exclusive', pro: '👑 Premium', std: '🎨 Oddiy dizaynlar' },
          notes: { vip: 'Faqat VIP variantida', pro: 'Premium va VIP’da (yashil belgilisi — Standartda ham)', std: 'Barcha variantlarda' },
          badge: { vip: 'VIP', pro: 'PREMIUM', open: 'OCHIQ' },
          pick: 'Dizaynni bosib tanlang', ok: '✅ Shu dizaynni tanlash', fits: 'Mos',
          lockPro: '🔒 Bu dizayn Premium variantida. Tanlasangiz, Premium’ga o‘tishni taklif qilamiz.',
          lockVip: '🔒 Bu dizayn faqat 💎 VIP variantida. Tanlasangiz, VIP’ga o‘tishni taklif qilamiz.',
          okPro: '👑 Premium bilan tanlash', okVip: '💎 VIP bilan tanlash', empty: 'Bu bo‘limda dizayn yo‘q' },
    ru: { title: '🎨 Все дизайны', all: 'Все', anyTier: 'Все', mine: '✨ Подходят вашей теме',
          mineNote: 'Подобраны по теме и аудитории',
          sub: n => `${n} дизайнов. Фото в примере — образец: в презентации будет фото по вашей теме.`,
          groups: { vip: '💎 VIP Exclusive', pro: '👑 Премиум', std: '🎨 Обычные дизайны' },
          notes: { vip: 'Только в варианте VIP', pro: 'В Premium и VIP (с зелёной меткой — и в Стандарте)', std: 'Во всех вариантах' },
          badge: { vip: 'VIP', pro: 'PREMIUM', open: 'ОТКРЫТ' },
          pick: 'Нажмите на дизайн', ok: '✅ Выбрать этот дизайн', fits: 'Для',
          lockPro: '🔒 Этот дизайн — в варианте Premium. Если выберете, предложим перейти на Premium.',
          lockVip: '🔒 Этот дизайн только в 💎 VIP. Если выберете, предложим перейти на VIP.',
          okPro: '👑 Выбрать с Premium', okVip: '💎 Выбрать с VIP', empty: 'В этом разделе нет дизайнов' },
  }[lang];
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const tx = v => (v && typeof v === 'object') ? (v[lang] || v.uz) : (v || '');
  document.documentElement.lang = lang;
  const data = await fetch('data.json?v=1').then(r => r.json());
  const byKey = Object.fromEntries(data.items.map(it => [it.key, it]));
  const avail = it => it.tier === 'std' || (it.tier === 'pro' ? (tier !== 'std' || !!it.open) : tier === 'vip');
  const recItems = rec.map(k => byKey[k]).filter(Boolean);
  const sec0 = q.get('sec');
  const state = { sec: data.sections.some(s => s.key === sec0) ? sec0 : '', tier: '', key: q.get('cur') && byKey[q.get('cur')] ? q.get('cur') : '' };
  // o'z variantidagilar oldin: VIP — VIP, Premium — Premium, Standart — oddiy (keyin qulfli yuqori darajalar)
  const order = { vip: ['vip', 'pro', 'std'], pro: ['pro', 'vip', 'std'], std: ['std', 'pro', 'vip'] }[tier];

  $('h1').textContent = L.title;
  $('sub').textContent = L.sub(data.items.length);

  function card(it) {
    const lock = !avail(it);
    const badge = it.tier === 'vip' ? `<span class="badge vip">💎 ${L.badge.vip}</span>`
      : it.tier === 'pro' ? (it.open ? `<span class="badge open">${L.badge.open}</span>` : `<span class="badge pro">👑 ${L.badge.pro}</span>`) : '';
    return `<div class="card ${lock ? 'locked' : ''} ${it.key === state.key ? 'sel' : ''}" data-k="${it.key}">
      <div class="thumb"><img loading="lazy" src="img/${it.key}.jpg?v=1" alt="${esc(tx(it.name))}">${badge}
        ${lock ? '<span class="lock">🔒</span>' : ''}<span class="check">✓</span></div>
      <div class="name"><span class="dot" style="--c1:${it.c1};--c2:${it.c2}"></span>${esc(tx(it.name))}</div></div>`;
  }
  function renderTabs() {
    const tabs = [{ key: '', label: L.all }].concat(data.sections.map(s => ({ key: s.key, label: s[lang] })));
    $('tabs').innerHTML = tabs.map(t => `<button class="tab ${t.key === state.sec ? 'active' : ''}" data-k="${t.key}">${esc(t.label)}</button>`).join('');
    $('tabs').querySelectorAll('.tab').forEach(el => el.onclick = () => { state.sec = el.dataset.k; render(true); });
    const inSec = data.items.filter(it => !state.sec || it.sec.includes(state.sec));
    const tiers = [{ key: '', label: `${L.anyTier} · ${inSec.length}` }].concat(order.map(t => ({ key: t,
      label: `${L.groups[t]} · ${inSec.filter(it => it.tier === t).length}` })));
    $('tiers').innerHTML = tiers.map(t => `<button class="tab ${t.key === state.tier ? 'active' : ''}" data-k="${t.key}">${esc(t.label)}</button>`).join('');
    $('tiers').querySelectorAll('.tab').forEach(el => el.onclick = () => { state.tier = el.dataset.k; render(true); });
  }
  function renderMain() {
    let html = '';
    if (recItems.length && !state.sec && !state.tier) {
      html += `<h2>${L.mine}</h2><p class="note">${L.mineNote}</p><div class="rec">${recItems.map(card).join('')}</div>`;
    }
    for (const t of order) {
      if (state.tier && state.tier !== t) continue;
      const items = data.items.filter(it => it.tier === t && (!state.sec || it.sec.includes(state.sec)));
      if (!items.length) continue;
      if (t !== 'std') items.sort((a, b) => (avail(b) - avail(a)) || (a.num - b.num));
      html += `<h2>${L.groups[t]} <small>${items.length}</small></h2><p class="note">${L.notes[t]}</p><div class="grid">${items.map(card).join('')}</div>`;
    }
    $('main').innerHTML = html || `<div class="empty">${L.empty}</div>`;
    $('main').querySelectorAll('.card').forEach(el => el.onclick = () => {
      state.key = el.dataset.k; if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
      $('main').querySelectorAll('.card').forEach(c => c.classList.toggle('sel', c.dataset.k === state.key));
      renderSheet();
    });
  }
  function renderSheet() {
    const it = byKey[state.key];
    $('hint').hidden = !!it; $('hint').textContent = L.pick;
    if (!it) { $('sheet').hidden = true; if (tg) tg.MainButton.hide(); return; }
    const lock = !avail(it);
    const okText = !lock ? L.ok : (it.tier === 'vip' ? L.okVip : L.okPro);
    $('sheet').hidden = false;
    $('sheet').innerHTML = `<div class="row"><div class="info"><b>${esc(tx(it.name))}</b>
        <div class="d">${esc(tx(it.desc))}${it.fits ? ` · ${L.fits}: ${esc(tx(it.fits))}` : ''}</div></div>
        <button class="x" id="close" aria-label="×">✕</button></div>
      <img class="inner" src="${it.inner}" alt="">
      ${lock ? `<div class="lockmsg ${it.tier}">${it.tier === 'vip' ? L.lockVip : L.lockPro}</div>` : ''}
      <button class="btn" id="ok">${okText}</button>`;
    $('close').onclick = () => { state.key = ''; renderMain(); renderSheet(); };
    $('ok').onclick = submit;
    if (tg) tg.MainButton.hide();   // pastdagi o'z tugmamiz yetarli (ikkita bo'lmasin)
  }
  function render(top) { renderTabs(); renderMain(); renderSheet(); if (top) window.scrollTo({ top: 0 }); }
  function submit() {
    if (!state.key) return;
    const payload = JSON.stringify({ v: 1, theme: state.key, subject: 'auto', from: 'catalog' });
    if (tg && tg.sendData) tg.sendData(payload); else alert(payload);
  }
  render(false);
  if (state.key) { const el = document.querySelector(`.card[data-k="${state.key}"]`); if (el) el.scrollIntoView({ block: 'center' }); }
})();
</script>
</body>
</html>
