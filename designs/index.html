<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dizaynlar — Slayd Ol</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f4f8);
    --fg: var(--tg-theme-text-color, #111827);
    --muted: var(--tg-theme-hint-color, #6b7280);
    --btn: var(--tg-theme-button-color, #2563eb);
    --btn-fg: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-section-bg-color, #ffffff);
    --std: #2563eb; --vip: #7c3aed; --pro: #b7862f; --ok: #16a34a; --con: #0f766e;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.4 -apple-system, "Segoe UI", Roboto, Inter, system-ui, sans-serif; }
  body { padding: 0 0 170px; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 12px 4px;
    border-bottom: 1px solid rgba(127,127,127,.15); }
  h1 { font-size: 17px; margin: 0 0 8px 4px; }
  /* 4 ta asosiy bo'lim: Standart · Premium · VIP · Konstruktor */
  .kinds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
  .kind { border: 2px solid transparent; border-radius: 12px; background: var(--bg2); color: var(--fg); padding: 7px 4px 6px;
    font: inherit; cursor: pointer; text-align: center; line-height: 1.15; min-height: 52px; }
  .kind b { display: block; font-size: 12.5px; }
  .kind small { display: block; font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .kind i { font-style: normal; font-size: 16px; display: block; }
  .kind.active { background: color-mix(in srgb, var(--k) 14%, var(--bg)); border-color: var(--k); }
  .kind.active b { color: var(--k); }
  .tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 6px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: 0 0 auto; padding: 6px 11px; border-radius: 999px; background: var(--bg2); color: var(--fg);
    font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap; border: 0; font-family: inherit; }
  .tab.active { background: var(--fg); color: var(--bg); }
  .intro { margin: 12px 16px 2px; padding: 10px 12px; border-radius: 12px; font-size: 13px;
    background: color-mix(in srgb, var(--k, var(--btn)) 10%, var(--bg)); }
  .intro b { color: var(--k); }
  h2 { font-size: 15px; margin: 16px 16px 2px; }
  .note { color: var(--muted); font-size: 12px; margin: 0 16px 6px; }
  .grid { padding: 8px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (min-width: 620px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 980px) { .grid { grid-template-columns: repeat(4, 1fr); } }
  .rec { display: flex; gap: 10px; overflow-x: auto; padding: 8px 16px; scrollbar-width: none; scroll-snap-type: x mandatory; }
  .rec::-webkit-scrollbar { display: none; }
  .rec .card { flex: 0 0 72%; max-width: 300px; scroll-snap-align: start; }
  .card { position: relative; border-radius: var(--radius); overflow: hidden; background: var(--card); cursor: pointer;
    border: 2px solid transparent; transition: transform .12s, border-color .12s;
    box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.08); }
  .card:active { transform: scale(.98); }
  .card.sel { border-color: var(--btn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--btn) 30%, transparent); }
  .thumb { position: relative; }
  .thumb img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; background: var(--bg2); }
  .card.locked .thumb img { filter: saturate(.75) brightness(.92); }
  .badge { position: absolute; bottom: 6px; left: 6px; font-size: 10.5px; font-weight: 800; color: #fff;
    padding: 2px 7px; border-radius: 999px; letter-spacing: .2px; }
  .badge.vip { background: var(--vip); } .badge.pro { background: var(--pro); } .badge.open { background: var(--ok); }
  .lock { position: absolute; right: 6px; top: 6px; width: 26px; height: 26px; border-radius: 50%;
    background: rgba(0,0,0,.6); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .check { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%; background: var(--btn);
    color: var(--btn-fg); display: none; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; }
  .card.sel .check { display: flex; }
  .card.sel .lock { display: none; }
  .name { padding: 7px 9px 8px; font-size: 12.5px; font-weight: 650; display: flex; gap: 6px; align-items: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 11px; height: 11px; border-radius: 50%; flex: 0 0 auto;
    background: linear-gradient(135deg, var(--c1) 50%, var(--c2) 50%); box-shadow: 0 0 0 1px rgba(127,127,127,.3); }
  .showall { margin: 4px 16px 0; border: 0; background: var(--bg2); color: var(--fg); font: inherit; font-size: 13px;
    font-weight: 600; padding: 8px 12px; border-radius: 10px; cursor: pointer; }
  .empty { padding: 24px 16px; color: var(--muted); text-align: center; }
  /* Konstruktor */
  .step { margin: 14px 16px 4px; font-weight: 700; font-size: 14px; }
  .styles { padding: 4px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .st { border: 2px solid transparent; border-radius: 12px; background: var(--bg2); padding: 9px 10px; cursor: pointer; }
  .st b { font-size: 13.5px; } .st div { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .st.active { border-color: var(--con); background: color-mix(in srgb, var(--con) 10%, var(--bg)); }
  .pals { padding: 4px 16px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .pal { border: 2px solid transparent; border-radius: 12px; padding: 6px 2px 5px; text-align: center; cursor: pointer;
    background: var(--bg2); font-size: 10.5px; font-weight: 600; }
  .pal span { display: block; width: 30px; height: 30px; margin: 0 auto 4px; border-radius: 50%;
    background: linear-gradient(135deg, var(--c1) 50%, var(--c2) 50%); box-shadow: 0 0 0 1px rgba(127,127,127,.3); }
  .pal.active { border-color: var(--con); }
  .preview { margin: 12px 16px; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,.1); }
  .preview img { display: block; width: 100%; background: var(--bg2); }
  .preview p { margin: 0; padding: 8px 10px; font-size: 12.5px; background: var(--card); }
  /* tanlangan dizayn */
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg);
    border-top: 1px solid rgba(127,127,127,.18); padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    box-shadow: 0 -8px 24px rgba(0,0,0,.08); }
  .sheet .row { display: flex; gap: 10px; align-items: flex-start; }
  .sheet .info { flex: 1; min-width: 0; }
  .sheet b { font-size: 14.5px; }
  .sheet .d { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .sheet .inner { width: 100%; border-radius: 10px; margin-top: 8px; display: block; background: var(--bg2); max-height: 120px; object-fit: cover; }
  .sheet .lockmsg { margin-top: 8px; font-size: 12.5px; padding: 7px 10px; border-radius: 10px;
    background: color-mix(in srgb, var(--pro) 14%, transparent); }
  .sheet .lockmsg.vip { background: color-mix(in srgb, var(--vip) 14%, transparent); }
  .btn { width: 100%; margin-top: 10px; padding: 13px; border: 0; border-radius: 12px; background: var(--btn);
    color: var(--btn-fg); font-size: 15.5px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .hint { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg); color: var(--muted);
    text-align: center; font-size: 13px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid rgba(127,127,127,.15); }
  .x { border: 0; background: var(--bg2); color: var(--fg); width: 30px; height: 30px; border-radius: 50%; font-size: 15px; cursor: pointer; flex: 0 0 auto; }
</style>
</head>
<body>
<header>
  <h1 id="h1"></h1>
  <div class="kinds" id="kinds"></div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="main"></main>
<div class="hint" id="hint"></div>
<div class="sheet" id="sheet" hidden></div>
<script>
(async function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  const q = new URLSearchParams(location.search);
  const lang = q.get('lang') === 'ru' ? 'ru' : 'uz';
  const tier = ['pro', 'vip'].includes(q.get('tier')) ? q.get('tier') : 'std';   // foydalanuvchi tanlagan variant
  const rec = (q.get('rec') || '').split(',').filter(Boolean);
  const L = {
    uz: { title: '🎨 Dizayn tanlash', all: 'Hammasi', mine: '✨ Mavzuingizga mos', mineNote: 'Mavzu va auditoriyangizga qarab tanlandi',
          kinds: { std: 'Standart', pro: 'Premium', vip: 'VIP Exclusive', con: 'Konstruktor' },
          small: { std: n => `${n} ta`, pro: n => `${n} ta`, vip: n => `${n} ta`, con: () => 'rangi o‘zingiz' },
          intro: {
            std: 'Barcha variantlarda ochiq. Muqovada mavzuingiz rasmi bo‘ladi. Shu 80 tani uslub → rang tartibida tanlash qulayroq bo‘lsa — <b>🛠 Konstruktor</b>.',
            pro: { ok: 'Sizning variantingizda <b>hammasi ochiq</b>. Muqovada katta rasm, nafis bezak.',
                   std: '<b>Premium</b> variantdagi dizaynlar. Yashil «OCHIQ» belgililari — Standartda ham ochiq. 🔒 belgilisini tanlasangiz, Premium’ga o‘tishni taklif qilamiz.' },
            vip: { ok: 'Sizning VIP variantingizda <b>hammasi ochiq</b>. Muqova mavzuingizga moslab maxsus chiziladi.',
                   no: 'Faqat <b>VIP</b> variantida: muqova mavzuingizga moslab maxsus chiziladi. Tanlasangiz, VIP’ga o‘tishni taklif qilamiz.' },
            con: 'Uslubni, keyin rangni o‘zingiz tanlang — pastda natija ko‘rinadi. Barcha variantlarda ochiq.' },
          step1: '1. Uslub', step2: '2. Rang', badge: { vip: 'VIP', pro: 'PREMIUM', open: 'OCHIQ' },
          pick: 'Dizaynni bosib tanlang', ok: '✅ Shu dizaynni tanlash', fits: 'Mos',
          lockPro: '🔒 Bu dizayn Premium variantida. Tanlasangiz, Premium’ga o‘tishni taklif qilamiz.',
          lockVip: '🔒 Bu dizayn faqat 💎 VIP variantida. Tanlasangiz, VIP’ga o‘tishni taklif qilamiz.',
          okPro: '👑 Premium bilan tanlash', okVip: '💎 VIP bilan tanlash', empty: 'Bu bo‘limda dizayn yo‘q',
          conSample: 'Namuna: muqova va 2 ta ichki slayd',
          cnt: n => `${n} ta`, of: (n, t) => `${n} ta (jami ${t} ta)`, showAll: t => `⬅️ Hammasini ko‘rsatish (${t} ta)` },
    ru: { title: '🎨 Выбор дизайна', all: 'Все', mine: '✨ Подходят вашей теме', mineNote: 'Подобраны по теме и аудитории',
          kinds: { std: 'Стандарт', pro: 'Премиум', vip: 'VIP Exclusive', con: 'Конструктор' },
          small: { std: n => `${n} шт.`, pro: n => `${n} шт.`, vip: n => `${n} шт.`, con: () => 'свой цвет' },
          intro: {
            std: 'Открыты во всех вариантах. На обложке — фото по вашей теме. Удобнее выбрать эти 80 по шагам «стиль → цвет» — <b>🛠 Конструктор</b>.',
            pro: { ok: 'В вашем варианте <b>все открыты</b>. Крупное фото на обложке, изящное оформление.',
                   std: 'Дизайны варианта <b>Premium</b>. С зелёной меткой «ОТКРЫТ» — доступны и в Стандарте. Если выберете дизайн с 🔒, предложим перейти на Premium.' },
            vip: { ok: 'В вашем VIP <b>все открыты</b>. Обложка рисуется специально под вашу тему.',
                   no: 'Только в варианте <b>VIP</b>: обложка рисуется специально под тему. Если выберете, предложим перейти на VIP.' },
            con: 'Выберите стиль, затем цвет — результат внизу. Открыто во всех вариантах.' },
          step1: '1. Стиль', step2: '2. Цвет', badge: { vip: 'VIP', pro: 'PREMIUM', open: 'ОТКРЫТ' },
          pick: 'Нажмите на дизайн', ok: '✅ Выбрать этот дизайн', fits: 'Для',
          lockPro: '🔒 Этот дизайн — в варианте Premium. Если выберете, предложим перейти на Premium.',
          lockVip: '🔒 Этот дизайн только в 💎 VIP. Если выберете, предложим перейти на VIP.',
          okPro: '👑 Выбрать с Premium', okVip: '💎 Выбрать с VIP', empty: 'В этом разделе нет дизайнов',
          conSample: 'Пример: обложка и 2 внутренних слайда',
          cnt: n => `${n} шт.`, of: (n, t) => `${n} из ${t}`, showAll: t => `⬅️ Показать все (${t})` },
  }[lang];
  const ICON = { std: '🎨', pro: '👑', vip: '💎', con: '🛠' };
  const COLOR = { std: 'var(--std)', pro: 'var(--pro)', vip: 'var(--vip)', con: 'var(--con)' };
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const tx = v => (v && typeof v === 'object') ? (v[lang] || v.uz) : (v || '');
  document.documentElement.lang = lang;
  const data = await fetch('data.json?v=3&t=' + Math.floor(Date.now() / 600000)).then(r => r.json());
  const byKey = Object.fromEntries(data.items.map(it => [it.key, it]));
  const avail = it => it.tier === 'std' || (it.tier === 'pro' ? (tier !== 'std' || !!it.open) : tier === 'vip');
  const recItems = rec.map(k => byKey[k]).filter(Boolean);
  const cur = q.get('cur') && byKey[q.get('cur')] ? q.get('cur') : '';
  const kinds0 = ['std', 'pro', 'vip', 'con'];
  const kind0 = kinds0.includes(q.get('kind')) ? q.get('kind') : (cur ? byKey[cur].tier : tier);
  const state = { kind: kind0, sec: '', key: cur, style: '', pal: '' };

  $('h1').textContent = L.title;

  function card(it) {
    const lock = !avail(it);
    const badge = it.tier === 'vip' ? `<span class="badge vip">💎 ${L.badge.vip}</span>`
      : it.tier === 'pro' ? (it.open ? `<span class="badge open">${L.badge.open}</span>` : `<span class="badge pro">👑 ${L.badge.pro}</span>`) : '';
    return `<div class="card ${lock ? 'locked' : ''} ${it.key === state.key ? 'sel' : ''}" data-k="${it.key}">
      <div class="thumb"><img loading="lazy" src="img/${it.key}.jpg?v=1" alt="${esc(tx(it.name))}">${badge}
        ${lock ? '<span class="lock">🔒</span>' : ''}<span class="check">✓</span></div>
      <div class="name"><span class="dot" style="--c1:${it.c1};--c2:${it.c2}"></span>${esc(tx(it.name))}</div></div>`;
  }
  function renderKinds() {
    const n = t => data.items.filter(it => it.tier === t).length;
    $('kinds').innerHTML = kinds0.map(k => `<button class="kind ${k === state.kind ? 'active' : ''}" data-k="${k}" style="--k:${COLOR[k]}">
      <i>${ICON[k]}</i><b>${L.kinds[k]}</b><small>${L.small[k](k === 'con' ? 0 : n(k))}</small></button>`).join('');
    $('kinds').querySelectorAll('.kind').forEach(el => el.onclick = () => {
      state.kind = el.dataset.k; state.sec = ''; render(true);
    });
  }
  function renderTabs() {
    if (state.kind === 'con') { $('tabs').innerHTML = ''; $('tabs').hidden = true; return; }
    $('tabs').hidden = false;
    const inKind = data.items.filter(it => it.tier === state.kind);
    const secs = data.sections.filter(s => inKind.some(it => it.sec.includes(s.key)));
    const tabs = [{ key: '', label: `${L.all} · ${inKind.length}` }].concat(secs.map(s => ({ key: s.key,
      label: `${s[lang]} · ${inKind.filter(it => it.sec.includes(s.key)).length}` })));
    $('tabs').innerHTML = tabs.map(t => `<button class="tab ${t.key === state.sec ? 'active' : ''}" data-k="${t.key}">${esc(t.label)}</button>`).join('');
    $('tabs').querySelectorAll('.tab').forEach(el => el.onclick = () => { state.sec = el.dataset.k; render(true); });
  }
  function intro(kind) {
    const i = L.intro[kind];
    if (kind === 'pro') return tier === 'std' ? i.std : i.ok;
    if (kind === 'vip') return tier === 'vip' ? i.ok : i.no;
    return i;
  }
  function renderMain() {
    const kind = state.kind;
    let html = `<div class="intro" style="--k:${COLOR[kind]}">${intro(kind)}</div>`;
    if (kind === 'con') { $('main').innerHTML = html + constructor(); bindConstructor(); return; }
    if (kind === tier && recItems.length && !state.sec) {
      html += `<h2>${L.mine}</h2><p class="note">${L.mineNote}</p><div class="rec">${recItems.map(card).join('')}</div>`;
    }
    const items = data.items.filter(it => it.tier === kind && (!state.sec || it.sec.includes(state.sec)));
    if (kind !== 'std') items.sort((a, b) => (avail(b) - avail(a)) || (a.num - b.num));
    const total = data.items.filter(it => it.tier === kind).length;
    const secName = state.sec ? `${data.sections.find(s => s.key === state.sec)[lang]} — ${L.of(items.length, total)}`
      : `${ICON[kind]} ${L.kinds[kind]} — ${L.cnt(total)}`;
    html += `<h2>${esc(secName)}</h2>` + (state.sec ? `<button class="showall" id="showall">${L.showAll(total)}</button>` : '');
    html += items.length ? `<div class="grid">${items.map(card).join('')}</div>` : `<div class="empty">${L.empty}</div>`;
    $('main').innerHTML = html;
    if ($('showall')) $('showall').onclick = () => { state.sec = ''; render(true); };
    $('main').querySelectorAll('.card').forEach(el => el.onclick = () => {
      state.key = el.dataset.k; if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
      $('main').querySelectorAll('.card').forEach(c => c.classList.toggle('sel', c.dataset.k === state.key));
      renderSheet();
    });
  }
  // 🛠 Konstruktor: uslub → rang → `uslub-rang` (oddiy dizayn)
  function constructor() {
    const st = data.styles.map(s => `<div class="st ${s.key === state.style ? 'active' : ''}" data-s="${s.key}">
        <b>${s.emoji} ${esc(tx(s.name))}</b><div>${esc(tx(s.desc))}</div></div>`).join('');
    const pal = data.palettes.map(p => `<div class="pal ${p.key === state.pal ? 'active' : ''}" data-p="${p.key}">
        <span style="--c1:${p.c1};--c2:${p.c2}"></span>${esc(tx(p.name))}</div>`).join('');
    const key = state.style && state.pal ? `${state.style}-${state.pal}` : '';
    const prev = key ? `<div class="preview"><img src="../img/themes/${key}.jpg?v=2" alt=""><p>${L.conSample}</p></div>` : '';
    return `<div class="step">${L.step1}</div><div class="styles">${st}</div>
      <div class="step">${L.step2}</div><div class="pals">${pal}</div>${prev}`;
  }
  function bindConstructor() {
    const pick = () => {
      state.key = state.style && state.pal ? `${state.style}-${state.pal}` : '';
      const y = window.scrollY; renderMain(); renderSheet(); window.scrollTo({ top: y });
    };
    $('main').querySelectorAll('.st').forEach(el => el.onclick = () => {
      state.style = el.dataset.s; if (!state.pal) state.pal = data.palettes[0].key; pick();
    });
    $('main').querySelectorAll('.pal').forEach(el => el.onclick = () => {
      state.pal = el.dataset.p; if (!state.style) state.style = data.styles[0].key; pick();
    });
  }
  function renderSheet() {
    const it = byKey[state.key];
    const show = it && (state.kind !== 'con' || it.tier === 'std');
    $('hint').hidden = !!show; $('hint').textContent = L.pick;
    if (!show) { $('sheet').hidden = true; if (tg) tg.MainButton.hide(); return; }
    const lock = !avail(it);
    const okText = !lock ? L.ok : (it.tier === 'vip' ? L.okVip : L.okPro);
    $('sheet').hidden = false;
    $('sheet').innerHTML = `<div class="row"><div class="info"><b>${esc(tx(it.name))}</b>
        <div class="d">${esc(tx(it.desc))}${it.fits ? ` · ${L.fits}: ${esc(tx(it.fits))}` : ''}</div></div>
        <button class="x" id="close" aria-label="×">✕</button></div>
      ${state.kind === 'con' ? '' : `<img class="inner" src="${it.inner}" alt="">`}
      ${lock ? `<div class="lockmsg ${it.tier}">${it.tier === 'vip' ? L.lockVip : L.lockPro}</div>` : ''}
      <button class="btn" id="ok">${okText}</button>`;
    $('close').onclick = () => { state.key = ''; if (state.kind === 'con') { state.style = ''; state.pal = ''; } renderMain(); renderSheet(); };
    $('ok').onclick = submit;
    if (tg) tg.MainButton.hide();   // pastdagi o'z tugmamiz yetarli
  }
  function render(top) { renderKinds(); renderTabs(); renderMain(); renderSheet(); if (top) window.scrollTo({ top: 0 }); }
  function submit() {
    if (!state.key) return;
    const payload = JSON.stringify({ v: 1, theme: state.key, subject: 'auto', from: state.kind === 'con' ? 'constructor' : 'catalog' });
    if (tg && tg.sendData) tg.sendData(payload); else alert(payload);
  }
  render(false);
  if (state.key) { const el = document.querySelector(`.card[data-k="${state.key}"]`); if (el) el.scrollIntoView({ block: 'center' }); }
})();
</script>
</body>
</html>
