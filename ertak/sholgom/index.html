<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Sehrli ertak</title>
<meta name="robots" content="noindex">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: kino-kitob — rasm butun ekran (kamera bilan), ustida rang-yorug'lik qatlamlari, pastda subtitr; yuqorida yupqa boshqaruv; o'yinlar alohida zal. Ataylab bitta sehrli-tun ko'rinishi. */
:root{
  --night:#140e2c; --dusk:#3a2766; --plum:#5a3d8f; --gold:#ffcf5a; --gold-deep:#d99a1e;
  --parch:#fff7e6; --ink:#2a1f3d; --pig:#ff7aa6; --pig-deep:#e0457b; --leaf:#4caf50; --leaf-deep:#2f7d32;
  --display:"Baloo 2","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% -10%,var(--plum) 0%,var(--dusk) 38%,var(--night) 75%) fixed;color:#fff;font-family:var(--body);font-size:16px;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#sky{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}

/* --- Boshlash --- */
.start{position:relative;height:100%;overflow:auto;margin:0 auto;max-width:560px;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center}
.tome{position:relative;flex-shrink:0;width:min(100%,500px);aspect-ratio:3/2;border-radius:18px;overflow:hidden;box-shadow:0 0 0 6px var(--gold-deep),0 0 0 10px #6b4a12,0 30px 60px -20px #000c,0 0 80px -10px #ffcf5a66;transform:perspective(900px) rotateX(6deg);animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:perspective(900px) rotateX(6deg) translateY(-6px)}}
.tome img{width:100%;height:100%;object-fit:cover;display:block}
.tome .tt{position:absolute;inset:auto 0 0 0;padding:18px 12px 14px;background:linear-gradient(180deg,transparent,#1b1338cc);font-family:var(--display);font-weight:800;font-size:clamp(24px,5.5vw,40px);line-height:1;color:#fff;text-shadow:0 3px 0 var(--pig-deep)}
.shine{background:linear-gradient(100deg,#fff 20%,var(--gold) 40%,#fff 60%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3.5s linear infinite;text-shadow:none}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
.start h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(22px,5vw,32px);line-height:1.1;text-wrap:balance}
.start p{margin:0;color:#d9cdf0;line-height:1.5;max-width:46ch}
.namebox{width:100%;display:flex;flex-direction:column;gap:8px}
.namebox label{font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.namebox input{font:800 22px var(--body);text-align:center;padding:12px;border-radius:16px;border:2px solid #ffcf5a88;background:#2a1f4d;color:#fff}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{padding:8px 16px;border-radius:999px;background:#ffffff1a;font-weight:800;border:1px solid #ffffff2e}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
.magic-btn{position:relative;font-family:var(--display);font-weight:800;font-size:22px;padding:14px 28px;border-radius:20px;color:var(--ink);background:linear-gradient(180deg,#ffe08a,var(--gold));box-shadow:0 6px 0 var(--gold-deep),0 0 30px #ffcf5a77;overflow:hidden}
.magic-btn::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#fff9 50%,transparent 70%);transform:translateX(-120%);animation:sweep 2.6s ease-in-out infinite}
@keyframes sweep{60%,100%{transform:translateX(120%)}}
.note{font-size:13px;color:#b9a9d6}

/* --- Kino ko'rinish --- */
#view{position:fixed;inset:0;overflow:hidden;background:#05030c;z-index:5}
#bgfill{position:absolute;inset:0;overflow:hidden}
#bgfill img{position:absolute;inset:-8%;width:116%;height:116%;object-fit:cover;filter:blur(26px) brightness(.5) saturate(1.3);transition:opacity .6s}
#world{position:absolute;left:0;top:0;width:1536px;height:1024px;transform-origin:0 0;will-change:transform}
#world img{width:100%;height:100%;display:block;transition:filter .8s}
#world.dim img{filter:brightness(.62) saturate(.85)}
#world.turn{animation:wturn .55s ease-in-out}
@keyframes wturn{0%{opacity:1}45%{opacity:0;filter:blur(6px)}55%{opacity:0}100%{opacity:1}}
.layer{position:absolute;inset:0;pointer-events:none}
#grade{mix-blend-mode:soft-light;transition:background 1.2s,opacity 1.2s}
#glow{mix-blend-mode:screen;transition:opacity 1s,background 1s}
#glow.flicker{animation:flicker 2.2s infinite}
@keyframes flicker{0%,100%{opacity:.9}20%{opacity:.6}40%{opacity:1}55%{opacity:.7}80%{opacity:.95}}
#rays{inset:-60%;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,236,170,.26) 0deg 5deg,transparent 5deg 15deg);mix-blend-mode:screen;opacity:0;transition:opacity 1.5s;animation:spin 90s linear infinite;-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 0%,transparent 55%);mask-image:radial-gradient(circle at 50% 50%,#000 0%,transparent 55%)}
@keyframes spin{to{transform:rotate(360deg)}}
#vig{background:radial-gradient(ellipse at 50% 45%,transparent 50%,rgba(5,3,15,.7) 100%);transition:opacity 1s}
.lb{position:absolute;left:0;right:0;height:0;background:#000;transition:height .5s cubic-bezier(.6,0,.3,1);z-index:6;pointer-events:none}
.lb.t{top:0}.lb.b{bottom:0}
#view.cine .lb{height:9vh}
#flash{background:#fff;opacity:0;z-index:7}
#flash.go{animation:flash .55s ease-out}
@keyframes flash{8%{opacity:.9}to{opacity:0}}
#view.shake #world{animation:shake .6s linear}
@keyframes shake{10%,50%,90%{translate:-14px 5px}30%,70%{translate:14px -5px}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
.bubble{position:absolute;z-index:9;transform:translate(-50%,-100%);padding:8px 16px;border-radius:20px;background:#fff;color:var(--ink);font-family:var(--display);font-weight:800;font-size:clamp(16px,2.6vw,26px);box-shadow:0 8px 20px #0006;animation:pop .4s cubic-bezier(.2,1.6,.4,1),fade 2.6s ease-in forwards;pointer-events:none;white-space:nowrap}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;border:9px solid transparent;border-top-color:#fff;border-bottom:0;transform:translateX(-50%)}
@keyframes pop{from{transform:translate(-50%,-100%) scale(.2)}}
@keyframes fade{82%{opacity:1}to{opacity:0;transform:translate(-50%,-140%)}}
.cover-title{position:absolute;z-index:8;left:0;right:0;text-align:center;font-family:var(--display);font-weight:800;font-size:clamp(30px,7vw,78px);line-height:1;color:#fff;padding:0 6%;text-wrap:balance;pointer-events:none;filter:drop-shadow(0 4px 0 var(--pig-deep)) drop-shadow(0 0 24px #ffcf5a88);animation:rise 1.2s cubic-bezier(.2,1.2,.3,1)}
.cover-title small{display:block;font-size:.36em;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:.25em}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.85)}}

/* Yuqori panel */
#hud{position:absolute;z-index:10;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:linear-gradient(#000a,transparent)}
.ttl{flex:1;min-width:0;font-family:var(--display);font-weight:800;font-size:clamp(15px,2.6vw,20px);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl b{color:var(--gold)}
.hb{width:40px;height:40px;flex-shrink:0;border-radius:50%;background:#ffffff22;border:1px solid #ffffff33;font-size:18px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hb[aria-pressed="false"]{opacity:.45}
.dots{position:absolute;z-index:10;left:50%;transform:translateX(-50%);top:calc(54px + env(safe-area-inset-top,0px));display:flex;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;background:#ffffff40;transition:all .3s}
.dot.me{width:26px;height:26px;margin-top:-9px;background-size:cover;background-position:center;border:2px solid var(--gold);box-shadow:0 0 12px var(--gold);animation:hop 1.2s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.hidstar{position:absolute;z-index:6;width:44px;height:44px;margin:-22px 0 0 -22px;font-size:30px;line-height:44px;text-align:center;opacity:.55;cursor:pointer;filter:drop-shadow(0 0 6px #ffd76a);animation:twk 2.4s ease-in-out infinite;touch-action:manipulation}
@keyframes twk{0%,100%{transform:scale(.8) rotate(-8deg);opacity:.35}50%{transform:scale(1.05) rotate(8deg);opacity:.75}}
.hidstar.got{animation:none;transition:all .7s cubic-bezier(.3,1.4,.5,1);opacity:1;transform:scale(2.2)}
.starbox{position:absolute;z-index:10;right:12px;top:calc(84px + env(safe-area-inset-top,0px));background:#0006;color:#ffe08a;font:800 15px Nunito,sans-serif;padding:4px 10px;border-radius:14px;pointer-events:none}
.starbox.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.35)}}
.askbox{position:absolute;z-index:12;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;transition:all .45s cubic-bezier(.3,1.5,.5,1);background:linear-gradient(180deg,#fffdf4,#ffe9b3);color:var(--ink);border-radius:26px;padding:18px 20px 16px;width:min(92vw,520px);box-shadow:0 18px 50px #0009,0 0 0 4px var(--gold);text-align:center}
.askbox.on{transform:translate(-50%,-50%) scale(1);opacity:1}
.askbox .q{font-family:var(--display);font-weight:800;font-size:clamp(18px,3vw,24px);margin:0 0 12px}
.askbox .who{font-size:34px;line-height:1}
.askbox button{display:block;width:100%;margin:8px 0 0;font-family:var(--display);font-weight:800;font-size:clamp(16px,2.6vw,20px);padding:12px 14px;border-radius:16px;border:0;background:#fff;color:var(--ink);box-shadow:0 4px 0 #d9b25a;cursor:pointer}
.askbox button.ok{background:#8fe08a;box-shadow:0 4px 0 #3e9a3a}
.askbox button.no{background:#ffb3a8;animation:shk .4s}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.hand{position:absolute;z-index:7;font-size:46px;pointer-events:none;animation:tapme 1.1s ease-in-out infinite;filter:drop-shadow(0 4px 6px #0008)}
@keyframes tapme{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6px,10px) scale(.88)}}
.dot.seen{background:#ffcf5a88}
.dot.on{background:var(--gold);box-shadow:0 0 10px var(--gold);width:20px;border-radius:5px}
.edge{position:absolute;z-index:10;width:52px;height:52px;border-radius:50%;background:#00000055;border:1px solid #ffffff44;font-size:30px;font-weight:900;line-height:1;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transform:translateY(-50%)}
.edge.l{left:max(10px,env(safe-area-inset-left,0px))}.edge.r{right:max(10px,env(safe-area-inset-right,0px))}
.edge:disabled{opacity:.25}
#sub{position:absolute;z-index:9;left:0;right:0;bottom:0;padding:34px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,rgba(8,5,22,.82) 42%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;cursor:pointer}
#view.portrait #sub{background:linear-gradient(rgba(8,5,22,.35),rgba(8,5,22,.75));justify-content:flex-start;padding-top:18px}
.line{max-width:min(900px,92vw);font-weight:900;font-size:clamp(19px,2.7vw,30px);line-height:1.35;text-shadow:0 2px 8px #000,0 0 2px #000;text-wrap:balance}
.line.all{font-weight:800;font-size:clamp(16px,2.1vw,22px);opacity:.95}
.w{display:inline-block;transition:color .15s,transform .2s;white-space:pre;margin:0 .07em;transform-origin:50% 70%}
.w.on{color:var(--gold);transform:translateY(-3px) scale(1.05)}
.w.nm,.nm{color:#ff9cc0}
.w.on.nm{color:var(--gold)}
.act{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.abtn{font-family:var(--display);font-weight:800;font-size:clamp(16px,2.4vw,21px);padding:10px 18px;border-radius:18px;background:linear-gradient(180deg,#fff,#ffe9b3);color:var(--ink);box-shadow:0 5px 0 var(--gold-deep),0 0 24px #ffcf5a99;animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{50%{transform:scale(1.07)}}
.tip{font-size:13px;font-weight:800;color:#e9dcff;opacity:.85}

/* --- O'yinlar zali --- */
#ov{position:absolute;inset:0;z-index:12;background:radial-gradient(circle at 50% 25%,#4a3480,#140e2c 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(64px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#gstage{position:relative;width:min(100%,calc(58vh * 1.5));aspect-ratio:3/2;border-radius:20px;overflow:hidden;background:#2a1f4d;box-shadow:0 0 0 5px var(--gold-deep),0 0 0 9px #6b4a12,0 24px 50px -18px #000d;flex-shrink:0}
#gstage>img.bgi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#gtext{width:min(100%,900px);background:linear-gradient(180deg,var(--parch),#fdeccb);color:var(--ink);border-radius:18px;padding:12px 16px;font-size:clamp(16px,2.3vw,20px);line-height:1.45}
.hall{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px;overflow:auto}
.gcard{border-radius:16px;background:#ffffff14;border:1px solid #ffffff2a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;font-family:var(--display);font-weight:800;font-size:clamp(14px,2.2vw,19px);color:#fff;text-align:center;transition:transform .2s}
.gcard:hover{transform:scale(1.04);background:#ffffff22}
.gcard .ic{font-size:clamp(26px,5vw,42px);line-height:1}
.gcard .st{font-size:13px;color:var(--gold);letter-spacing:2px}
.board{position:absolute;inset:0;padding:10px;display:grid;gap:8px}
.mem{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);perspective:800px}
.card{position:relative;transform-style:preserve-3d;transition:transform .45s;border-radius:12px;min-height:0}
.card .f,.card .b{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.card .b{background:linear-gradient(135deg,var(--gold),var(--pig));display:grid;place-items:center;font-size:clamp(22px,4vw,34px);box-shadow:inset 0 0 0 3px #fff8}
.card .f{transform:rotateY(180deg);background:#fff}
.card .f img{width:100%;height:100%;object-fit:cover}
.card.up{transform:rotateY(180deg)}
.card.done .f{box-shadow:0 0 0 4px var(--gold),0 0 18px var(--gold)}
.puz{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:3px;padding:6px}
.tile{background-size:300% 300%;border-radius:6px;transition:transform .2s,box-shadow .2s}
.tile.sel{transform:scale(.92);box-shadow:0 0 0 4px var(--gold)}
.board.cv{display:block;padding:0}
.board.cv canvas{width:100%;height:100%;display:block}
.qbox{display:flex;flex-direction:column;gap:10px}
.q{font-family:var(--display);font-weight:800;font-size:clamp(18px,2.6vw,23px);line-height:1.2;margin:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.opt{padding:12px;border-radius:14px;background:#efe3ff;color:var(--ink);font-weight:800;font-size:18px;box-shadow:0 4px 0 #c7b3e8}
.opt.ok{background:#c9f2b8;box-shadow:0 4px 0 #8fcf74}
.opt.no{background:#ffd1d1;animation:no .35s}
@keyframes no{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.stars{font-size:30px;letter-spacing:4px;color:var(--gold-deep)}
.pal{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.pal button{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px #0003}
.pal button[aria-pressed="true"]{outline:3px solid var(--ink)}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.sbtn{padding:10px 16px;border-radius:14px;background:var(--plum);color:#fff;font-weight:800}
@media (prefers-reduced-motion:reduce){.tome,.abtn,.shine,#rays{animation:none}}
@media (max-aspect-ratio:1/1){#gstage{aspect-ratio:1/1}}
@media (max-width:560px){.hall{grid-template-columns:repeat(2,1fr)}.hb{width:36px;height:36px;font-size:16px}.edge{width:46px;height:46px;font-size:26px}}
</style>

  <div id="bgfill"><img id="bgimg" alt=""></div>

<script>
const VOICED=["Mustafo","Madina","Abdulloh"];
const TALE=window.TALE; const SC=TALE.SC, FX=TALE.FX; const KEY=TALE.id+'_';
// Botdan kelgan havola: ?n=Ism&k=token&api=https://... — ism ovozi API'dan (maxfiy token), ism tahrirlanmaydi
const Q=new URLSearchParams(location.search); const PRE=(Q.get('n')||'').trim().slice(0,20); const TOK=(Q.get('k')||'').replace(/[^A-Za-z0-9_-]/g,'').slice(0,40);
const API=(Q.get('api')||(window.GO_CONFIG&&window.GO_CONFIG.apiBase)||'').replace(/\/$/,'');
// O'g'il / qiz: ?s=g — qiz versiyasi rasmlari (TALE.girl bo'lsa, img/g/ papkada)
const GIRL=Q.get('s')==='g' && !!TALE.girl;

function loopNoise(f,q,v,lfo){ const s=ac.createBufferSource(); s.buffer=nbuf(); s.loop=true; const fl=ac.createBiquadFilter(); fl.type='bandpass'; fl.frequency.value=f; fl.Q.value=q; const g=ac.createGain(); g.gain.setValueAtTime(.0001,T()); g.gain.exponentialRampToValueAtTime(v,T()+1.5); let out=g; let o2; if(lfo&&ac.createStereoPanner){ const p=ac.createStereoPanner(); o2=ac.createOscillator(); o2.frequency.value=lfo; const lg=ac.createGain(); lg.gain.value=.7; o2.connect(lg).connect(p.pan); g.connect(p); out=p; o2.start() } s.connect(fl).connect(g); out.connect(ambBus); s.start(); return ()=>{ g.gain.setTargetAtTime(.0001,T(),.3); setTimeout(()=>{try{s.stop();o2&&o2.stop()}catch(e){}},1200) } }

  if(kind==='birds'||kind==='breeze'){ every(1400,4200,()=>{ const p=rnd(-.8,.8),b=rnd(2400,3400); for(let i=0;i<3;i++) tone(b,i*.11,.08,'sine',.035,b*1.35,ambBus,p) }) }
  if(kind==='breeze') st.push(loopNoise(700,.7,.08,.08));

  if(kind==='night'){ st.push(loopNoise(400,.5,.06,.05)); every(700,1300,()=>{ const p=rnd(-.7,.7); for(let i=0;i<4;i++) tone(4300,i*.045,.03,'square',.012,null,ambBus,p) }) }

    cs.forEach((c,i)=>{ const b=bs[i]; const d=b?b.duration:(c.url===null?.5:Math.min(4,1+s.t.length/16)); if(b){ const n=a.createBufferSource(); n.buffer=b; n.connect(voiceBus); n.start(t); srcs.push(n) } seg.push([t,d]); t+=d; if(i<cs.length-1) t+=c.gap });

function draw(p){ const k=1-p.life/p.max; cx.globalAlpha=Math.max(0,Math.min(1,k*1.4))*p.a; const r=p.r*(1+p.grow*p.life); cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot);
  switch(p.kind){
    case 'spark': cx.fillStyle=`hsl(${p.hue??45} 100% ${72+Math.random()*20}%)`; cx.shadowColor=cx.fillStyle; cx.shadowBlur=12; star(cx,0,0,r); cx.fill(); break;
    case 'glow': cx.globalCompositeOperation='lighter'; cx.drawImage(glowSprite,-r,-r,r*2,r*2); break;
    case 'dot': cx.globalCompositeOperation='lighter'; cx.fillStyle=`hsl(${p.hue??50} 100% 65%)`; cx.beginPath(); cx.arc(0,0,r,0,7); cx.fill(); cx.globalAlpha*=.5; cx.drawImage(glowSprite,-r*3,-r*3,r*6,r*6); break;
    case 'heart': cx.fillStyle='#ff5c8d'; cx.font=`${r*4}px serif`; cx.fillText('❤',-r*2,r); break;
    case 'note': cx.fillStyle='#fff'; cx.shadowColor='#ffcf5a'; cx.shadowBlur=10; cx.font=`900 ${r*5}px serif`; cx.fillText(p.ch||'♪',0,0); break;
    case 'leaf': cx.fillStyle=`hsl(${p.hue??30} 90% 52%)`; cx.beginPath(); cx.ellipse(0,0,r*1.6,r*.8,0,0,7); cx.fill(); cx.strokeStyle='#0003'; cx.beginPath(); cx.moveTo(-r*1.6,0); cx.lineTo(r*1.6,0); cx.stroke(); break;
    case 'straw': cx.strokeStyle=`hsl(${44+p.ph*2} 85% ${60+p.ph}%)`; cx.lineWidth=Math.max(1.5,r*.5); cx.lineCap='round'; cx.beginPath(); cx.moveTo(-r*3,0); cx.lineTo(r*3,0); cx.stroke(); break;
    case 'twig': cx.strokeStyle='#7a4a24'; cx.lineWidth=Math.max(2,r*.7); cx.lineCap='round'; cx.beginPath(); cx.moveTo(-r*3,0); cx.lineTo(r*3,0); cx.moveTo(0,0); cx.lineTo(r*1.4,-r*1.4); cx.stroke(); break;
    case 'drop': cx.fillStyle='#d6f1ff'; cx.shadowColor='#7ec8ff'; cx.shadowBlur=8; cx.beginPath(); cx.ellipse(0,0,r*.7,r*1.25,Math.atan2(p.vy,p.vx)+Math.PI/2-p.rot,0,7); cx.fill(); break;
    case 'ring': cx.strokeStyle='#e6f7ff'; cx.lineWidth=3*U; cx.beginPath(); cx.ellipse(0,0,r+p.life*2.6*U,(r+p.life*2.6*U)*.32,0,0,7); cx.stroke(); break;
    case 'smoke': cx.fillStyle='#ffffff'; cx.globalAlpha*=.3; cx.beginPath(); cx.arc(0,0,r+p.life*.28*U,0,7); cx.fill(); break;
    case 'dust': cx.fillStyle='#e0c497'; cx.globalAlpha*=.5; cx.beginPath(); cx.arc(0,0,r+p.life*.18*U,0,7); cx.fill(); break;
    case 'fly': { const b=.5+.5*Math.sin(p.life*.15+p.ph); cx.globalCompositeOperation='lighter'; cx.globalAlpha*=b; cx.drawImage(glowSprite,-r*4,-r*4,r*8,r*8); cx.fillStyle='#fff7a0'; cx.beginPath(); cx.arc(0,0,r*.7,0,7); cx.fill(); break }
    case 'eye': { const o=(p.life%150)<9?.05:1; cx.globalCompositeOperation='lighter'; cx.globalAlpha*=o; cx.drawImage(glowSprite,-r*4,-r*4,r*8,r*8); cx.fillStyle='#ffd23c'; cx.beginPath(); cx.ellipse(0,0,r,r*.55,0,0,7); cx.fill(); break }
    case 'confetti': cx.fillStyle=`hsl(${p.hue} 90% 60%)`; cx.scale(1,Math.cos(p.life*.2+p.ph)); cx.fillRect(-r,-r*.5,r*2,r); break;
    case 'brick': cx.fillStyle='#c4532f'; cx.fillRect(-r*1.6,-r*.7,r*3.2,r*1.4); cx.strokeStyle='#7b2e15'; cx.lineWidth=1.5; cx.strokeRect(-r*1.6,-r*.7,r*3.2,r*1.4); break;
    case 'gust': cx.strokeStyle='rgba(255,255,255,.75)'; cx.lineWidth=2.5*U; cx.lineCap='round'; cx.beginPath(); cx.moveTo(-r*7,0); cx.quadraticCurveTo(0,-r*1.2,r*7,0); cx.stroke(); break;
    case 'trail': cx.globalCompositeOperation='lighter'; cx.fillStyle=`hsl(${p.hue} 100% 70%)`; star(cx,0,0,r); cx.fill(); cx.globalAlpha*=.6; cx.drawImage(glowSprite,-r*2.5,-r*2.5,r*5,r*5); break;
    case 'bfly': { const f=Math.abs(Math.sin(p.life*.35+p.ph)); cx.fillStyle=`hsl(${p.hue??30} 90% 60%)`; cx.beginPath(); cx.ellipse(-r*.9*f,0,r*.9*f,r*.7,0,0,7); cx.ellipse(r*.9*f,0,r*.9*f,r*.7,0,0,7); cx.fill(); cx.fillStyle='#2a1f3d'; cx.fillRect(-r*.12,-r*.6,r*.24,r*1.2); break }
    default: if(TALE.draw) TALE.draw(p,cx,r,U);
  } cx.restore(); cx.globalCompositeOperation='source-over' }
let lastF=0;

const view=$('#view'), world=$('#world');
let CAM={fx:.5,fy:.5,z:1,x:0,y:0,s:1}, R={x:0,y:0,w:0,h:0}, portrait=false;
function region(){ VW=innerWidth; VH=innerHeight; portrait=VW/VH<1.15; view.classList.toggle('portrait',portrait);
  if(portrait){ const top=58, h=Math.min(VH*.64, VW*1.3); R={x:0,y:top,w:VW,h} } else R={x:0,y:0,w:VW,h:VH};

  const mid=R.y+R.h/2; $('#prev').style.top=mid+'px'; $('#next').style.top=mid+'px' }
function cam(fx,fy,z=1,dur=0,ease='cubic-bezier(.45,.05,.35,1)'){ const base=Math.max(R.w/1536,R.h/1024), s=base*z, w=1536*s, h=1024*s;
  const x=Math.min(R.x, Math.max(R.x+R.w-w, R.x+R.w/2-fx*w)), y=Math.min(R.y, Math.max(R.y+R.h-h, R.y+R.h/2-fy*h));
  world.style.transition=dur?`transform ${dur}s ${ease}`:'none'; world.style.transform=`translate(${x}px,${y}px) scale(${s})`; CAM={fx,fy,z,x,y,s} }
const S=(n)=>({x:CAM.x+n[0]*1536*CAM.s, y:CAM.y+n[1]*1024*CAM.s});
function settle(sc,dur=14){ const [a,b]=portrait?sc.pan:[sc.f,sc.f]; cam(a[0],a[1],1.02,0); requestAnimationFrame(()=>requestAnimationFrame(()=>cam(b[0],b[1],1.1,dur,'linear'))) }
function grade(sc){ $('#grade').style.background=sc.grade||'none'; const g=$('#glow'); g.style.background=sc.glow||'none'; g.classList.toggle('flicker',!!sc.flicker); g.style.opacity=sc.glow?1:0;
  const r=$('#rays'); r.style.opacity=sc.rays||0; if(sc.ray){ const p=S(sc.ray); r.style.transformOrigin=''; r.style.left=(p.x-VW*1.1)+'px'; r.style.top=(p.y-VH*1.1)+'px'; r.style.width=VW*2.2+'px'; r.style.height=VH*2.2+'px'; r.style.right='auto'; r.style.bottom='auto' }

  function show(){ box.innerHTML=''; if(i>=Q.length){ const n=scr>=5?3:scr>=3?2:1; read([vq[4]]); return win('quiz',n,`${scr} / ${Q.length} to‘g‘ri javob!`) }
    const it=Q[i]; const q=document.createElement('p'); q.className='q'; q.textContent=`${i+1}. ${it.q}`; const os=document.createElement('div'); os.className='opts'; box.append(q,os); let wrong=0;
    it.o.forEach((o,k)=>{ const bt=document.createElement('button'); bt.className='opt'; bt.textContent=o.replace('{NAME}',NAME); bt.onclick=()=>{ if(k===it.a){ bt.classList.add('ok'); if(!wrong) scr++; SFX.chime(); haptic('light'); gfx(.5,.5,40,'spark',{sp:6,g:.03}); setTimeout(()=>{ i++; show() },900) } else { wrong++; bt.classList.remove('no'); void bt.offsetWidth; bt.classList.add('no'); SFX.wrong() } }; os.appendChild(bt) });
    if(i<3&&vq[i+1]) read([vq[i+1]]) }
  read([vq[0]],show) }
function mem(){ const b=board('mem'); const ks=TALE.memCards; const deck=[...ks,...ks].sort(()=>Math.random()-.5); let open=[], found=0, moves=0, lock=false;
  deck.forEach(k=>{ const c=document.createElement('button'); c.className='card'; c.innerHTML=`<div class="b">✨</div><div class="f"><img src="${img('card_'+k)}" alt=""></div>`; c.dataset.k=k;
    c.onclick=()=>{ if(lock||c.classList.contains('up')) return; c.classList.add('up'); SFX.flip(); open.push(c); if(open.length===2){ moves++; lock=true; const [x,y]=open;
      if(x.dataset.k===y.dataset.k){ setTimeout(()=>{ x.classList.add('done'); y.classList.add('done'); SFX.chime(); haptic('light'); const r=y.getBoundingClientRect(); burst(r.left+r.width/2,r.top+r.height/2,24,'spark',{sp:4,g:.02}); open=[]; lock=false; if(++found===6) setTimeout(()=>win('mem',moves<=9?3:moves<=13?2:1,`Barakalla! ${moves} urinishda topding!`),600) },400) }
      else setTimeout(()=>{ x.classList.remove('up'); y.classList.remove('up'); open=[]; lock=false },900) } }; b.appendChild(c) });
  gtx.innerHTML='<p class="q">Juftini top! Ikkita bir xil qahramonni och.</p>'; gtx.appendChild(backBtn()) }
function puz(){ const b=board('puz'); let order=[...Array(9).keys()]; do{ order.sort(()=>Math.random()-.5) }while(order.every((v,i)=>v===i)); let sel=null, moves=0;
  function render(){ b.innerHTML=''; order.forEach((v,i)=>{ const t=document.createElement('button'); t.className='tile'; t.style.backgroundImage=`url(${img(TALE.puzzleImg)})`; t.style.backgroundPosition=`${(v%3)*50}% ${Math.floor(v/3)*50}%`; t.setAttribute('aria-label','Bo‘lak '+(i+1)); if(sel===i) t.classList.add('sel');
    t.onclick=()=>{ if(sel===null){ sel=i; SFX.pop(); render() } else { [order[sel],order[i]]=[order[i],order[sel]]; sel=null; moves++; SFX.brick(); render(); if(order.every((v,i)=>v===i)) setTimeout(()=>win('puz',moves<=8?3:moves<=12?2:1,`Rasm yig‘ildi! ${moves} ta almashtirish.`),300) } }; b.appendChild(t) }) }
  render(); gtx.innerHTML='<p class="q">Rasmni yig‘! Ikki bo‘lakni ketma-ket bossang, joyi almashadi.</p>'; gtx.appendChild(backBtn()) }
function color(){ const b=board('cv'); b.style.background='#fff'; const c=document.createElement('canvas'); b.appendChild(c); const g=c.getContext('2d',{willReadFrequently:true}); const im=new Image(); im.onload=()=>{ c.width=im.naturalWidth; c.height=im.naturalHeight; g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0) }; im.src=img('color');
  const cols=['#ff7aa6','#ffcf5a','#4caf50','#4aa3df','#c4532f','#8a5cd6','#ff8a3d','#8d6e63','#9e9e9e','#ffffff']; let col=cols[0], fills=0;
  gtx.innerHTML=`<p class="q">${esc(full(BOOK.games.color[0]))}</p>`; const pal=document.createElement('div'); pal.className='pal'; cols.forEach((cc,i)=>{ const bt=document.createElement('button'); bt.style.background=cc; bt.setAttribute('aria-label','Rang '+(i+1)); bt.setAttribute('aria-pressed',i===0); bt.onclick=()=>{ col=cc; SFX.pop(); pal.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===bt)) }; pal.appendChild(bt) });
  const r=document.createElement('div'); r.className='row'; const ok=document.createElement('button'); ok.className='sbtn'; ok.textContent='✅ Tayyor'; ok.onclick=()=>win('color',fills>=12?3:fills>=6?2:1,'Qanday chiroyli rasm!'); r.append(ok); gtx.append(pal,r,backBtn());
  c.addEventListener('pointerdown',e=>{ A(); const rr=c.getBoundingClientRect(); if(fillAt(g,Math.floor((e.clientX-rr.left)/rr.width*c.width),Math.floor((e.clientY-rr.top)/rr.height*c.height),col)){ fills++; SFX.sparkle(); burst(e.clientX,e.clientY,10,'spark',{sp:3,g:.02}) } });
  read([BOOK.games.color[0]]) }
function fillAt(ctx,x,y,hex){ const w=ctx.canvas.width,h=ctx.canvas.height,d=ctx.getImageData(0,0,w,h),a=d.data,t=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)); const i0=(y*w+x)*4, dark=v=>a[v]+a[v+1]+a[v+2]<330; if(dark(i0)) return false; const s=[a[i0],a[i0+1],a[i0+2]]; if(Math.abs(s[0]-t[0])+Math.abs(s[1]-t[1])+Math.abs(s[2]-t[2])<12) return false; const seen=new Uint8Array(w*h), st=[x+y*w];
  while(st.length){ const p=st.pop(); if(seen[p]) continue; seen[p]=1; const i=p*4; if(dark(i)||Math.abs(a[i]-s[0])+Math.abs(a[i+1]-s[1])+Math.abs(a[i+2]-s[2])>110) continue; a[i]=t[0];a[i+1]=t[1];a[i+2]=t[2]; const px=p%w; if(px>0)st.push(p-1); if(px<w-1)st.push(p+1); if(p>=w)st.push(p-w); if(p<w*(h-1))st.push(p+w) } ctx.putImageData(d,0,0); return true }
function cert(){ const b=board('cv'); const c=document.createElement('canvas'); b.appendChild(c); c.width=1500; c.height=1000; const g=c.getContext('2d'); const st=totalStars();
  const bg=g.createRadialGradient(750,450,100,750,500,900); bg.addColorStop(0,'#fff8e1'); bg.addColorStop(1,'#ffe0ec'); g.fillStyle=bg; g.fillRect(0,0,1500,1000);
  g.strokeStyle='#d99a1e'; g.lineWidth=20; g.strokeRect(36,36,1428,928); g.strokeStyle='#e0457b'; g.lineWidth=5; g.strokeRect(74,74,1352,852);
  for(let i=0;i<40;i++){ g.fillStyle=`hsla(${45+Math.random()*20},100%,60%,.5)`; star(g,100+Math.random()*1300,100+Math.random()*800,4+Math.random()*8); g.fill() }
  const pic=new Image(); pic.onload=()=>{ g.save(); g.beginPath(); g.arc(1250,250,120,0,7); g.clip(); g.drawImage(pic,1130,130,240,240); g.restore(); g.strokeStyle='#d99a1e'; g.lineWidth=8; g.beginPath(); g.arc(1250,250,120,0,7); g.stroke() }; pic.src=img(TALE.certPic);
  document.fonts.ready.then(()=>{ g.textAlign='center'; g.fillStyle='#2a1f3d'; g.font='800 70px "Baloo 2",sans-serif'; g.fillText('SERTIFIKAT',750,200); g.fillStyle='#7a6a92'; g.font='700 40px Nunito,sans-serif'; g.fillText('Ushbu sertifikat egasi',750,280);
    g.fillStyle='#e0457b'; g.font='800 140px "Baloo 2",sans-serif'; g.fillText(NAME,750,440); g.fillStyle='#2a1f3d'; g.font='700 42px Nunito,sans-serif'; g.fillText(TALE.cert.line1,750,545); g.fillText(TALE.cert.line2,750,600);
    g.fillStyle='#2f7d32'; g.font='800 78px "Baloo 2",sans-serif'; g.fillText(TALE.cert.badge,750,720); g.fillStyle='#d99a1e'; g.font='800 54px serif'; g.fillText('★'.repeat(Math.min(15,Math.max(1,st))),750,815); g.fillStyle='#7a6a92'; g.font='700 30px Nunito,sans-serif'; g.fillText(`${st} ta yulduz · ${new Date().toLocaleDateString('uz-UZ')}`,750,880) });
  SFX.fanfare(); later(300,()=>{ confetti(); fireworks(3) }); gtx.innerHTML=`<p class="q">${esc(full(BOOK.games.cert[0]))}</p>`; gtx.appendChild(backBtn()); read([BOOK.games.cert[0]]) }

document.title=TALE.title; $('#tomeSuffix').textContent=TALE.suffix; $('#tomeName').textContent=PRE||TALE.hero; $('#nm').value=PRE||TALE.hero; $('#tomeImg').alt=TALE.title+' muqovasi'; if(GIRL) $('#tomeImg').src=img('cover');

const photoNote=(d,n)=>{ if(n) $('.note').textContent=d<n?`🎨 ${norm(PRE||NAME)} rasmlari yuklanmoqda… ${d}/${n}`:'✨ Har sahifada — '+norm(PRE||NAME)+'ning o‘zi!' };
if(PHOTO) loadPhotos(photoNote).then(()=>{ if(PIMG.cover) $('#tomeImg').src=PIMG.cover });
$('#go').onclick=async()=>{ NAME=norm($('#nm').value)||TALE.hero; A(); SFX.open(); haptic('medium');
  if(PHOTO){ const g=$('#go'); g.disabled=true; const t0=g.textContent; g.textContent='🎨 Rasmlar tayyorlanmoqda…'; await loadPhotos(photoNote); g.disabled=false; g.textContent=t0 }
  if(!BOOK) BOOK=await fetch('book.json').then(r=>r.json()); loadName();
  try{ if(TG){ TG.expand&&TG.expand(); TG.requestFullscreen&&TG.requestFullscreen() } }catch(e){}
  $('#start').hidden=true; $('#sky').hidden=true; view.hidden=false; $('#ttl').innerHTML=`<b>${esc(NAME)}</b> ${esc(TALE.suffix)}`; cvSize(); region();
  cur=0; try{ const s=+localStorage.getItem(KEY+'p_'+NAME); if(s>0&&s<BOOK.pages.length) cur=s }catch(e){}
  flash('#ffe9a8'); burst(VW/2,VH/2,90,'spark',{sp:9,g:.02}); add({kind:'glow',x:VW/2,y:VH/2,r:260,max:30,grow:.02});
  showPage(true); later(900,()=>{ if(cur===0) fireworks(2); showPage() }); music(true) };
$('#prev').onclick=()=>{ A(); prev() }; $('#next').onclick=()=>{ A(); next() };
$('#play').onclick=()=>{ A(); if(playing) return stopVoice(); if(mode==='story') read(BOOK.pages[cur].s,()=>renderAll()) };
$('#mus').onclick=()=>{ A(); music(!musicOn) };
$('#aut').onclick=()=>{ autoOn=!autoOn; $('#aut').setAttribute('aria-pressed',autoOn) };
$('#gm').onclick=()=>{ A(); turn(openHall) };
$('#fs').onclick=()=>{ try{ if(TG&&TG.requestFullscreen) return TG.requestFullscreen(); const d=document; if(d.fullscreenElement) d.exitFullscreen(); else d.documentElement.requestFullscreen().catch(()=>{}) }catch(e){} };
document.addEventListener('keydown',e=>{ if(view.hidden) return; if(e.key==='ArrowRight') next(); if(e.key==='ArrowLeft') prev() });
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ stopVoice(); if(ac) ac.suspend() } else if(ac) ac.resume() });
addEventListener('resize',()=>{ cvSize(); skySize(); if(!view.hidden&&mode==='story'){ region(); const sc=SC[BOOK.pages[cur].img]; settle(sc,10); grade(sc) } });
skySize(); cvSize(); requestAnimationFrame(loop);
